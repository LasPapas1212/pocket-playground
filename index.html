<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Playground</title>
<meta name="description" content="Tiny free browser games. No sign-up, just play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout: chunky toy-box cards on a paper ground; each game lives in one bordered "stage". */
:root{
  --bg:#f7f1e6; --surface:#fffdf8; --ink:#1f1b16; --muted:#6b6258; --line:#e6dccb;
  --red:#e5533d; --yellow:#f2b632; --teal:#1a9a91; --blue:#3a6ee8; --pink:#d94f93;
  --green:#3f9f43; --purple:#7b5cd6; --orange:#e8742a; --sky:#2f9fd6; --lime:#8cb82c;
  --shadow:#1f1b16; --hole:#3b2f25;
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --surface:#221f19; --ink:#f3ede2; --muted:#a59c8f; --line:#37312a; --shadow:#000; --hole:#0d0b08; color-scheme:dark;
  }
}
:root[data-theme="dark"]{ --bg:#16140f; --surface:#221f19; --ink:#f3ede2; --muted:#a59c8f; --line:#37312a; --shadow:#000; --hole:#0d0b08; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.45; min-height:100vh; -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--blue); outline-offset:3px}
kbd{font:inherit; font-size:12px; border:1.5px solid var(--line); border-bottom-width:3px; border-radius:6px; padding:0 6px}
.wrap{max-width:1240px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* header */
header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:24px 4px}
.brand{display:flex; align-items:center; gap:12px; text-decoration:none}
.logo{width:44px; height:44px; border-radius:12px; background:var(--yellow); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--shadow); display:grid; place-items:center; font-size:24px}
.brand b{font-size:26px; font-weight:800; letter-spacing:-.02em}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid var(--ink); background:var(--surface); border-radius:12px; padding:10px 16px; font-weight:600; cursor:pointer;
  box-shadow:3px 3px 0 var(--shadow); text-decoration:none; transition:transform .08s, box-shadow .08s; touch-action:manipulation}
.btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--ink); color:var(--bg)}
.btn.sm{padding:6px 12px; font-size:14px; border-radius:10px; box-shadow:2px 2px 0 var(--shadow)}
.btn:disabled{opacity:.5; cursor:default; transform:none}

/* home */
.hero{display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:16px; margin:24px 0 20px}
.hero h1{font-size:clamp(30px,5vw,48px); line-height:1.05; margin:0; letter-spacing:-.03em; font-weight:800; max-width:16ch; text-wrap:balance}
.hero p{margin:8px 0 0; color:var(--muted); font-size:17px}
.recent{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 16px}
.recent span{color:var(--muted); font-weight:600; font-size:14px; margin-right:4px}
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 20px}
.search{flex:1 1 220px; min-width:0; font:inherit; font-size:16px; padding:9px 14px; border:2px solid var(--ink); border-radius:12px; background:var(--surface); color:var(--ink)}
.cats{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:2px solid var(--ink); background:var(--surface); border-radius:999px; padding:5px 12px; font-weight:600; font-size:14px; cursor:pointer}
.chip small{opacity:.65; font-weight:400; margin-left:2px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg)}

.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; padding-bottom:32px}
@media (min-width:560px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px} }
@media (min-width:800px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (min-width:1000px){ .grid{grid-template-columns:repeat(5,minmax(0,1fr)); gap:18px} }
.card{position:relative; display:flex; flex-direction:column; text-decoration:none; background:var(--surface); border:2px solid var(--ink); border-radius:18px; overflow:hidden; box-shadow:5px 5px 0 var(--shadow); transition:transform .1s, box-shadow .1s}
.card:hover{transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--shadow)}
.card:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--shadow)}
.art{aspect-ratio:16/10; max-width:100%; background:var(--c); display:grid; place-items:center; border-bottom:2px solid var(--ink); position:relative; overflow:hidden}
.art span{font-size:50px; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.25)); transition:transform .2s}
.card:hover .art span{transform:scale(1.12) rotate(-6deg)}
.art::before{content:""; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.22) 2px, transparent 2px); background-size:16px 16px}
.newtag{position:absolute; top:10px; right:10px; z-index:1; background:var(--surface); border:2px solid var(--ink); border-radius:999px; font-size:12px; font-weight:800; padding:1px 9px}
.info{padding:12px 16px 16px; display:flex; flex-direction:column; gap:3px; flex:1}
.cattag{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600}
.info h2{margin:0; font-size:20px; letter-spacing:-.01em}
.info p{margin:0; color:var(--muted); font-size:15px; flex:1}
.pill{align-self:flex-start; margin-top:8px; font-size:13px; font-weight:600; border:1.5px solid var(--line); border-radius:999px; padding:2px 10px; color:var(--muted)}
.pill.has{border-color:var(--ink); color:var(--ink)}
.empty-state{grid-column:1/-1; border:2px dashed var(--line); border-radius:18px; padding:32px 16px; text-align:center; color:var(--muted)}
.empty-state p{margin:0 0 12px}
.foot-tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; color:var(--muted); font-size:14px; padding-bottom:16px}
footer{color:var(--muted); font-size:14px; padding-block:8px 32px}

/* game page */
.gamehead{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:20px 0 8px}
.gamehead .spacer{flex:1}
.gtitle{margin:12px 0 4px; font-size:clamp(28px,4vw,38px); letter-spacing:-.02em; text-wrap:balance}
.howto{color:var(--muted); margin:0 0 16px; font-size:16px; max-width:72ch}
.seg{display:inline-flex; border:2px solid var(--ink); border-radius:10px; overflow:hidden; box-shadow:2px 2px 0 var(--shadow)}
.seg button{border:0; background:var(--surface); padding:6px 12px; font-weight:600; font-size:14px; cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.stage{position:relative; height:500px; background:var(--surface); border:2px solid var(--ink); border-radius:18px; overflow:hidden; box-shadow:5px 5px 0 var(--shadow);
  margin-bottom:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:16px; user-select:none; -webkit-user-select:none}
.stage:focus{outline:none}
.stage.flush{padding:0; gap:0}
.stage.tight{gap:10px; padding:12px}
.keys-hint{color:var(--muted); font-size:13px; margin:0 0 16px}
.pager{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:40px}

.hud{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 22px; font-size:15px; color:var(--muted)}
.hud b{color:var(--ink); font-size:21px; font-variant-numeric:tabular-nums}
.hud.float{position:absolute; top:10px; left:16px; right:16px; justify-content:flex-start; z-index:2; pointer-events:none}
.msg{margin:0; color:var(--muted); min-height:1.5em; text-align:center}
.float-msg{position:absolute; left:16px; right:16px; bottom:16px; margin:0; text-align:center; color:var(--muted); font-weight:600; pointer-events:none; z-index:2}

/* results */
.end{position:absolute; inset:0; background:color-mix(in srgb, var(--bg) 84%, transparent); display:grid; place-items:center; z-index:5; animation:fade .2s; padding:16px}
.endbox{background:var(--surface); border:2px solid var(--ink); border-radius:16px; padding:22px 28px; text-align:center; box-shadow:5px 5px 0 var(--shadow); width:min(100%,340px)}
.endbox .eyebrow{margin:0; font-weight:600; color:var(--muted)}
.endbox .eyebrow.new{color:var(--green)}
.endbox .big{margin:4px 0; font-size:40px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.endbox .detail{margin:0 0 6px; color:var(--ink)}
.endbox .muted{margin:0 0 16px; color:var(--muted)}
.endbtns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* shared tile grids: minmax(0,1fr) keeps every cell the same size no matter what it holds */
.tiles{display:grid; gap:6px; width:min(100%,380px); aspect-ratio:1; max-width:100%; flex:none}
.tiles > *{min-width:0; min-height:0; overflow:hidden; border:0; border-radius:8px; padding:0; cursor:pointer; touch-action:manipulation; display:grid; place-items:center; line-height:1}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* reaction */
.rx{position:absolute; inset:0; border:0; width:100%; height:100%; cursor:pointer; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:16px; text-align:center; touch-action:manipulation}
.rx strong{font-size:clamp(30px,6vw,52px); letter-spacing:-.02em}
.rx span{font-size:17px; opacity:.95; max-width:38ch}
.rx .dots{display:flex; gap:8px; margin-top:6px}
.rx .dots i{width:14px; height:14px; border-radius:50%; border:2px solid #fff}
.rx .dots i.on{background:#fff}
.rx[data-s=idle],.rx[data-s=done],.rx[data-s=set]{background:var(--blue)}
.rx[data-s=wait]{background:var(--red)}
.rx[data-s=go]{background:var(--green)}
.rx[data-s=early]{background:var(--orange)}

/* click frenzy */
.bigpad{width:220px; height:220px; border-radius:50%; border:3px solid var(--ink); background:var(--pink); color:#fff; font-size:22px; font-weight:800; cursor:pointer; box-shadow:0 8px 0 var(--shadow); touch-action:manipulation}
.bigpad:active{transform:translateY(6px); box-shadow:0 2px 0 var(--shadow)}
.bigpad:disabled{opacity:.6; cursor:default}

/* number rush */
.nums > *{background:var(--bg); border:2px solid var(--ink); font-size:clamp(16px,4vw,24px); font-weight:800; font-variant-numeric:tabular-nums}
.nums > .empty{border-color:transparent; background:transparent; cursor:default}
.nums > .done{background:var(--teal); color:#fff; border-color:var(--teal)}
.nums > .wrong{background:var(--red); color:#fff; border-color:var(--red)}

/* echo pads */
.pads{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; width:min(100%,320px); aspect-ratio:1}
.pads button{border:3px solid var(--ink); border-radius:20px; cursor:pointer; opacity:.5; transition:opacity .1s, transform .1s; touch-action:manipulation; font-size:20px; font-weight:800; color:#fff}
.pads button.lit{opacity:1; transform:scale(1.04)}

/* type sprint */
.words{position:relative; width:min(100%,680px); font-size:22px; line-height:1.75; padding:10px 14px; border:2px solid var(--line); border-radius:12px; height:142px; overflow:hidden; text-align:left}
.words .w{display:inline-block; margin-right:.55em; border-radius:4px}
.words .w.cur{background:color-mix(in srgb, var(--yellow) 35%, transparent)}
.words .w.ok{color:var(--green)}
.words .w.bad{color:var(--red); text-decoration:line-through}
.words .l.ok{color:var(--green)}
.words .l.bad{color:var(--red); background:color-mix(in srgb, var(--red) 15%, transparent)}
.words .l.x{color:var(--red); opacity:.8}
.words .l.caret{box-shadow:-2px 0 0 var(--ink)}
.words .w.cur.endcaret{box-shadow:2px 0 0 var(--ink)}
.typein{user-select:text; -webkit-user-select:text; width:min(100%,680px); font:inherit; font-size:20px; padding:10px 14px; border:2px solid var(--ink); border-radius:12px; background:var(--bg); color:var(--ink)}

/* aim / arenas */
.arena{position:absolute; inset:0; cursor:crosshair; touch-action:manipulation}
.target{position:absolute; width:var(--s); height:var(--s); margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border-radius:50%; border:3px solid var(--ink); cursor:pointer; padding:0;
  background:radial-gradient(circle, #fff 0 18%, var(--red) 19% 45%, #fff 46% 62%, var(--red) 63%); animation:pop .12s; touch-action:manipulation}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}

/* higher lower */
.hlcard{width:150px; height:190px; border:3px solid var(--ink); border-radius:18px; background:var(--purple); color:#fff; display:grid; place-items:center; font-size:68px; font-weight:800; box-shadow:5px 5px 0 var(--shadow); font-variant-numeric:tabular-nums}
.hlrow{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}

/* tile merge */
.merge{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:repeat(4,minmax(0,1fr)); gap:10px; width:min(100%,410px); aspect-ratio:1; background:var(--line); padding:10px; border-radius:14px; border:2px solid var(--ink); touch-action:none; flex:none}
.merge div{min-width:0; min-height:0; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:clamp(20px,6vw,36px); background:var(--bg); font-variant-numeric:tabular-nums}
.merge div.n{animation:pop .15s}
.merge div.big{font-size:clamp(16px,4.6vw,28px)}

/* sweeper */
.mines{gap:3px}
.mines > *{background:var(--line); border-radius:4px; font-weight:800}
.mines > .open{background:var(--bg); cursor:default}
.mines > .boom{background:var(--red)}
.flagbtn[aria-pressed="true"]{background:var(--yellow); color:#1f1b16}

/* pair up */
.cards{gap:10px; width:min(100%,360px)}
.cards > *{border:2px solid var(--ink); border-radius:10px; background:var(--purple); font-size:clamp(24px,7vw,38px)}
.cards > .up{background:var(--bg)}
.cards > .got{background:color-mix(in srgb, var(--green) 30%, var(--bg)); cursor:default}

/* bonk */
.holes{gap:14px; width:min(100%,330px)}
.holes > *{border-radius:50%; border:3px solid var(--ink); background:var(--hole); font-size:clamp(30px,9vw,46px)}
.holes > .up{background:var(--yellow); animation:pop .12s}
.holes > .hit{background:var(--orange)}

/* go / no-go */
.gng-area{width:200px; height:200px; display:grid; place-items:center}
.gng{width:170px; height:170px; display:grid; place-items:center; font-size:30px; font-weight:800; color:#fff; border:3px solid transparent}
.gng.go{background:var(--green); border-color:var(--ink); border-radius:50%; animation:pop .1s}
.gng.nogo{background:var(--red); border-color:var(--ink); border-radius:18px; animation:pop .1s}

/* lightning tiles */
.lt > *{background:var(--bg); border:2px solid var(--line); border-radius:12px}
.lt > .lit{background:var(--sky); border-color:var(--ink); box-shadow:0 0 0 4px color-mix(in srgb, var(--sky) 35%, transparent)}
.lt > .miss{background:var(--red)}

/* five letters */
.fl-board{display:grid; grid-template-rows:repeat(6,minmax(0,1fr)); gap:5px; width:min(100%, 260px); flex:none}
.fl-row{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px}
.fl-row > div{aspect-ratio:1; border:2px solid var(--line); border-radius:6px; display:grid; place-items:center; font-weight:800; font-size:22px; text-transform:uppercase; min-width:0}
.fl-row > div.filled{border-color:var(--ink)}
.fl-row > div.hit{background:var(--green); border-color:var(--green); color:#fff; animation:flip .3s}
.fl-row > div.near{background:var(--yellow); border-color:var(--yellow); color:#1f1b16; animation:flip .3s}
.fl-row > div.miss{background:var(--muted); border-color:var(--muted); color:var(--bg); animation:flip .3s}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.fl-kb{display:flex; flex-direction:column; gap:6px; width:min(100%,500px)}
.fl-kb div{display:flex; gap:5px; justify-content:center}
.fl-kb button{flex:1 1 0; min-width:0; height:40px; border:0; border-radius:6px; background:var(--line); font-weight:700; text-transform:uppercase; cursor:pointer; touch-action:manipulation; padding:0}
.fl-kb button.wide{flex:1.6 1 0; font-size:13px}
.fl-kb button.hit{background:var(--green); color:#fff}
.fl-kb button.near{background:var(--yellow); color:#1f1b16}
.fl-kb button.miss{background:var(--muted); color:var(--bg)}
.toast{position:absolute; top:12px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:6px 14px; border-radius:10px; font-weight:600; z-index:3; pointer-events:none}

/* 2-player */
.turnline{margin:0; font-weight:700; font-size:18px; min-height:1.5em; text-align:center}
.ttt{width:min(100%,300px)}
.ttt > *{background:var(--bg); border:2px solid var(--ink); font-size:clamp(40px,12vw,68px); font-weight:800}
.ttt > .x{color:var(--blue)}
.ttt > .o{color:var(--red)}
.ttt > .win{background:color-mix(in srgb, var(--yellow) 45%, var(--bg))}
.ttt > :disabled{cursor:default}
.c4{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:repeat(6,minmax(0,1fr)); gap:6px; padding:8px; background:var(--blue); border:2px solid var(--ink); border-radius:14px; width:min(100%,390px); aspect-ratio:7/6; flex:none}
.c4 > div{border-radius:50%; background:var(--surface); cursor:pointer; min-width:0; min-height:0}
.c4 > .p1{background:var(--red)}
.c4 > .p2{background:var(--yellow)}
.c4 > .win{box-shadow:inset 0 0 0 4px var(--ink)}
.c4 > .drop{animation:drop .25s ease-in}
@keyframes drop{from{transform:translateY(-240%)}to{transform:none}}
.seg{flex-wrap:wrap}

canvas.cv{display:block; width:100%; touch-action:none; cursor:pointer}

/* ---------- v3: effects, settings, new games ---------- */
.top-actions{display:flex; gap:8px; flex-wrap:wrap}
.gameview{max-width:1000px; margin:0 auto}
.info h2{font-size:18px}
.info p{font-size:14px}
.card{animation:rise .4s ease-out backwards; animation-delay:calc(var(--i, 0) * 22ms)}
#app > *{animation:rise .3s ease-out backwards}
@keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
.logo{transition:transform .3s}
.brand:hover .logo{transform:rotate(-12deg) scale(1.1)}
.hud b{display:inline-block}
.bump{animation:bump .25s}
@keyframes bump{0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)}}
.floaty{position:absolute; z-index:4; pointer-events:none; font-weight:800; font-size:20px; color:var(--green); transform:translate(-50%,-50%); animation:floaty .75s ease-out forwards; white-space:nowrap}
@keyframes floaty{from{opacity:1; transform:translate(-50%,-50%)} to{opacity:0; transform:translate(-50%,-170%)}}
.confetti{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:7}
.quake{animation:quake .4s}
@keyframes quake{0%,100%{transform:translate(0)} 20%{transform:translate(-8px,3px)} 40%{transform:translate(7px,-4px)} 60%{transform:translate(-5px,2px)} 80%{transform:translate(4px,-1px)}}
.endbox{animation:endpop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes endpop{from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1}}
.pop{animation:pop .15s}
html.reduce *, html.reduce *::before, html.reduce *::after{animation:none!important; transition:none!important}
html.nohints .keys-hint{display:none}

dialog#settings{border:2px solid var(--ink); border-radius:18px; background:var(--surface); color:var(--ink); padding:0; width:min(92vw,460px); max-height:88vh; box-shadow:6px 6px 0 var(--shadow)}
dialog#settings::backdrop{background:rgba(0,0,0,.45)}
dialog#settings[open]{animation:endpop .3s cubic-bezier(.2,1.6,.4,1)}
.set{padding:18px 20px 20px; display:flex; flex-direction:column; gap:14px}
.set-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.set h2{margin:0; font-size:24px; letter-spacing:-.01em}
.set h3{margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.set section{display:flex; flex-direction:column; gap:8px; border-top:1.5px solid var(--line); padding-top:12px}
.set .row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; min-height:36px}
.set input[type=checkbox]{width:22px; height:22px; accent-color:var(--blue); cursor:pointer}
.set input[type=range]{flex:1; min-width:120px; accent-color:var(--blue)}

.lo > *{background:var(--hole); border:2px solid var(--ink); transition:background .12s, box-shadow .12s}
.lo > .on{background:var(--yellow); box-shadow:0 0 18px color-mix(in srgb, var(--yellow) 70%, transparent)}
.sp > *{background:var(--blue); color:#fff; border:2px solid var(--ink); font-size:clamp(20px,6vw,34px); font-weight:800; transition:transform .1s}

.ws-tiles span{display:grid; place-items:center; width:clamp(34px,9vw,46px); height:clamp(42px,11vw,54px); border:2px solid var(--ink); border-radius:10px; background:var(--yellow); color:#1f1b16; font-weight:800; font-size:24px; text-transform:uppercase; box-shadow:2px 2px 0 var(--shadow); animation:pop .2s backwards}

.fl-kb button:disabled{cursor:default}

.duel-side.p1{background:var(--blue)}
.duel-side.p2{background:var(--red)}

<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#games"><span class="logo" aria-hidden="true">🕹️</span><b>Pocket Playground</b></a>
    <div class="top-actions">
      <button class="btn sm" id="sound" type="button" aria-pressed="true"></button>
      <button class="btn sm" id="settings-btn" type="button">⚙️ Settings</button>
    </div>
  </header>
  <main id="app"></main>
  <footer>Your best scores are saved in this browser only.</footer>
</div>

<dialog id="settings" aria-labelledby="set-title">
  <form method="dialog" class="set">
    <div class="set-head"><h2 id="set-title">Settings</h2><button class="btn sm" value="close" aria-label="Close settings">✕ Close</button></div>
    <section>
      <h3>Sound</h3>
      <label class="row" for="set-sound"><span>Sound effects</span><input type="checkbox" id="set-sound"></label>
      <div class="row"><label for="set-volume">Volume</label><div class="set-vol"><input type="range" id="set-volume" min="0" max="100" step="5"><output id="set-vol-out" for="set-volume"></output></div></div>
      <div class="row"><span>Hear it</span><button type="button" class="btn sm" id="set-test">▶ Test sound</button></div>
    </section>
    <section>
      <h3>Look and feel</h3>
      <div class="row"><span>Theme</span><div class="seg" id="set-theme" role="group" aria-label="Theme"><button type="button" data-v="system">System</button><button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button></div></div>
      <div class="row"><span>Animations</span><div class="seg" id="set-motion" role="group" aria-label="Animations"><button type="button" data-v="full">Full</button><button type="button" data-v="reduced">Reduced</button></div></div>
      <label class="row" for="set-confetti"><span>Confetti on a new best</span><input type="checkbox" id="set-confetti"></label>
      <label class="row" for="set-shake"><span>Screen shake</span><input type="checkbox" id="set-shake"></label>
      <label class="row" for="set-hints"><span>Show keyboard shortcuts</span><input type="checkbox" id="set-hints"></label>
    </section>
    <section>
      <h3>Your data</h3>
      <div class="row" id="set-reset-area"></div>
    </section>
  </form>
</dialog>

<script>
'use strict';
/* =========================================================
   Helpers
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const rand = n => Math.floor(Math.random()*n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const FONT = '"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif';
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

/* storage that never throws; falls back to memory if the browser blocks it */
const mem = new Map();
const store = {
  get(k){
    try{ const v = localStorage.getItem('pp:'+k); if(v != null) return JSON.parse(v); }catch(e){}
    return mem.has(k) ? mem.get(k) : null;
  },
  set(k, v){ mem.set(k, v); try{ localStorage.setItem('pp:'+k, JSON.stringify(v)); }catch(e){} },
  clearPrefix(prefixes){
    const hit = k => prefixes.some(p => k === p || k.startsWith(p));
    [...mem.keys()].forEach(k => { if(hit(k)) mem.delete(k); });
    try{
      const ks = [];
      for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith('pp:') && hit(k.slice(3))) ks.push(k); }
      ks.forEach(k => localStorage.removeItem(k));
    }catch(e){}
  },
  clearBests(){ this.clearPrefix(['best:']); },
  clearAll(){ this.clearPrefix(['best:', 'plays:', 'pops']); }
};
const prefs = Object.assign({muted:false, modes:{}, recent:[], volume:0.7, theme:'system', motion:'full', confetti:true, shake:true, hints:true}, store.get('prefs') || {});
if(typeof prefs.modes !== 'object' || !prefs.modes) prefs.modes = {};
if(!Array.isArray(prefs.recent)) prefs.recent = [];
if(typeof prefs.volume !== 'number' || !(prefs.volume >= 0 && prefs.volume <= 1)) prefs.volume = 0.7;
if(!['system','light','dark'].includes(prefs.theme)) prefs.theme = 'system';
if(!['full','reduced'].includes(prefs.motion)) prefs.motion = 'full';
const savePrefs = () => store.set('prefs', prefs);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[ch]));
const motionOK = () => prefs.motion !== 'reduced' && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- sound engine: small synth, no audio files ---------- */
let actx = null;
function audio(){
  if(prefs.muted || prefs.volume <= 0) return null;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq, dur=0.15, o={}){
  const a = audio(); if(!a) return;
  try{
    const t0 = a.currentTime + (o.delay || 0), osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(Math.max(20, freq), t0);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + o.slide), t0 + dur);
    const v = (o.vol == null ? 0.1 : o.vol)*prefs.volume;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(a.destination); osc.start(t0); osc.stop(t0 + dur + 0.03);
  }catch(e){}
}
function noise(dur=0.3, o={}){
  const a = audio(); if(!a) return;
  try{
    const len = Math.max(1, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2 - 1)*(1 - i/len);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = o.freq || 900;
    g.gain.value = (o.vol == null ? 0.25 : o.vol)*prefs.volume;
    src.connect(f).connect(g).connect(a.destination); src.start();
  }catch(e){}
}
function beep(freq, dur=0.15){ tone(freq, dur, {type:'triangle', vol:0.09}); tone(freq*2, dur*0.5, {type:'sine', vol:0.025}); }
const SFX = {
  click(){ tone(1400, 0.03, {type:'square', vol:0.025}); },
  pop(){ tone(500 + Math.random()*300, 0.09, {type:'sine', slide:600, vol:0.12}); },
  coin(){ tone(988, 0.07, {type:'square', vol:0.04}); tone(1319, 0.16, {type:'square', vol:0.04, delay:0.07}); },
  miss(){ tone(180, 0.18, {type:'sawtooth', slide:-80, vol:0.05}); },
  jump(){ tone(380, 0.16, {type:'triangle', slide:420, vol:0.08}); },
  power(){ [440, 554, 659, 880].forEach((f, i) => tone(f, 0.1, {type:'triangle', vol:0.07, delay:i*0.05})); },
  level(){ tone(660, 0.1, {type:'square', vol:0.04}); tone(990, 0.2, {type:'square', vol:0.04, delay:0.1}); },
  boom(){ noise(0.45, {freq:700, vol:0.3}); tone(120, 0.4, {type:'sine', slide:-80, vol:0.12}); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, {type:'square', vol:0.045, delay:i*0.09})); tone(1568, 0.4, {type:'triangle', vol:0.05, delay:0.36}); },
  lose(){ tone(392, 0.18, {type:'triangle', vol:0.07}); tone(311, 0.18, {type:'triangle', vol:0.07, delay:0.16}); tone(247, 0.35, {type:'triangle', vol:0.07, delay:0.32}); },
  end(){ tone(523, 0.12, {type:'triangle', vol:0.06}); tone(659, 0.2, {type:'triangle', vol:0.06, delay:0.1}); }
};

/* ---------- visual effects ---------- */
function particles(){
  let ps = [];
  return {
    burst(x, y, color, n=12, sp=180){
      if(!motionOK()) n = Math.ceil(n/3);
      for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = sp*(0.3 + Math.random()*0.7); ps.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:0.45 + Math.random()*0.4, t:0, color, s:2 + Math.random()*3}); }
    },
    update(dt){ for(const p of ps){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 420*dt; } ps = ps.filter(p => p.t < p.life); },
    draw(ctx){ for(const p of ps){ ctx.globalAlpha = Math.max(0, 1 - p.t/p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s); } ctx.globalAlpha = 1; }
  };
}
function floatText(stage, x, y, text, color){
  if(!motionOK() || !stage.isConnected) return;
  const s = document.createElement('span'); s.className = 'floaty'; s.textContent = text;
  s.style.left = x + 'px'; s.style.top = y + 'px'; if(color) s.style.color = color;
  stage.appendChild(s); setTimeout(() => s.remove(), 760);
}
function confetti(stage){
  if(!prefs.confetti || !motionOK()) return;
  const cv = document.createElement('canvas'); cv.className = 'confetti'; stage.appendChild(cv);
  const w = stage.clientWidth, h = stage.clientHeight, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const P = pal(), cols = [P.red, P.yellow, P.green, P.blue, P.pink, P.purple, P.orange];
  const ps = Array.from({length:140}, () => ({x:w/2 + (Math.random() - .5)*80, y:h*0.45, vx:(Math.random() - .5)*760, vy:-280 - Math.random()*520, r:Math.random()*6, vr:(Math.random() - .5)*12, s:5 + Math.random()*5, c:cols[rand(cols.length)]}));
  let last = performance.now(), t = 0;
  const f = now => {
    const dt = Math.min(0.05, (now - last)/1000); last = now; t += dt;
    ctx.clearRect(0, 0, w, h);
    for(const p of ps){ p.vy += 900*dt; p.vx *= 0.99; p.x += p.vx*dt; p.y += p.vy*dt; p.r += p.vr*dt; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); ctx.restore(); }
    if(t < 2.2 && cv.isConnected) requestAnimationFrame(f); else cv.remove();
  };
  requestAnimationFrame(f);
}
function shake(el){
  if(!prefs.shake || !motionOK()) return;
  el.classList.remove('quake'); void el.offsetWidth; el.classList.add('quake');
  setTimeout(() => el.classList.remove('quake'), 450);
}

function pal(){
  const s = getComputedStyle(document.documentElement), o = {};
  ['bg','surface','ink','muted','line','red','yellow','teal','blue','pink','green','purple','orange','sky','lime'].forEach(k => o[k] = s.getPropertyValue('--'+k).trim());
  return o;
}
function txt(ctx, s, x, y, color, size=20, weight=600, align='center'){
  ctx.fillStyle = color; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y);
}
function makeCanvas(el){
  const c = document.createElement('canvas'); c.className = 'cv'; el.appendChild(c);
  const ctx = c.getContext('2d');
  const w = el.clientWidth, h = el.clientHeight, dpr = window.devicePixelRatio || 1;
  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); c.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); c.W = w; c.H = h;
  return {c, ctx};
}
function ptr(c, e){ const r = c.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function gridN(el, cols, rows=cols){
  el.style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`;
  el.style.gridTemplateRows = `repeat(${rows},minmax(0,1fr))`;
}
function placeTarget(arena, size, top=46){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'target'; b.setAttribute('aria-label','Target');
  b.style.setProperty('--s', size+'px');
  const W = arena.clientWidth, H = arena.clientHeight, m = size/2 + 8;
  b.style.left = (m + Math.random()*Math.max(0, W - 2*m)) + 'px';
  b.style.top = (top + m + Math.random()*Math.max(0, H - top - 2*m - 30)) + 'px';
  arena.appendChild(b); return b;
}
function segDist(a, b, p){
  const dx = b.x-a.x, dy = b.y-a.y, L = dx*dx + dy*dy;
  let t = L ? ((p.x-a.x)*dx + (p.y-a.y)*dy)/L : 0; t = clamp(t, 0, 1);
  return Math.hypot(p.x - (a.x+t*dx), p.y - (a.y+t*dy));
}
function onSwipe(api, el, fn){
  let sx = null, sy = null;
  api.on(el, 'pointerdown', e => { sx = e.clientX; sy = e.clientY; });
  api.on(el, 'pointerup', e => {
    if(sx == null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    fn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  });
  api.on(el, 'pointercancel', () => { sx = null; });
}
/* everything a game registers goes in a bag that is emptied when the game stops */
function bag(){
  const offs = [], tids = new Set(); let alive = true;
  return {
    on(t, type, fn, o){ t.addEventListener(type, fn, o); offs.push(() => t.removeEventListener(type, fn, o)); },
    after(fn, ms){ const id = setTimeout(() => { tids.delete(id); if(alive) fn(); }, ms); tids.add(id); return id; },
    every(fn, ms){ const id = setInterval(() => { if(alive) fn(); }, ms); tids.add(id); return id; },
    loop(fn){
      let raf, last = performance.now();
      const f = t => { if(!alive) return; const dt = Math.min(0.05, Math.max(0, (t-last)/1000)); last = t; fn(dt); if(alive) raf = requestAnimationFrame(f); };
      raf = requestAnimationFrame(f); offs.push(() => cancelAnimationFrame(raf));
    },
    run(){ alive = false; tids.forEach(id => { clearTimeout(id); clearInterval(id); }); tids.clear(); offs.splice(0).forEach(f => { try{ f(); }catch(e){} }); }
  };
}

/* =========================================================
   Games
   ========================================================= */
const GAMES = [];
const game = def => GAMES.push(def);
const CATS = [
  {id:'all', label:'All'}, {id:'reaction', label:'Reaction'}, {id:'aim', label:'Aim'}, {id:'arcade', label:'Arcade'},
  {id:'puzzle', label:'Puzzle'}, {id:'memory', label:'Memory'}, {id:'word', label:'Word'}, {id:'two', label:'2 Player'}, {id:'chill', label:'Chill'}
];

/* ---------- Reaction Time ---------- */
game({
  id:'reaction', cat:'reaction', title:'Reaction Time', icon:'⚡', color:'var(--blue)',
  blurb:'Click the moment it turns green.', how:'Click (or press Space) to start, wait for green, then click as fast as you can. Every 5 tries you get your average.',
  lower:true, fmt:v => v+' ms',
  extraBest:{key:'avg', label:'Best avg'},
  mount(el, api){
    el.classList.add('flush');
    el.innerHTML = '<button class="rx" type="button"></button>';
    const b = $('.rx', el);
    let state = 'idle', t0 = 0, tid = null, set5 = [];
    const dots = () => `<div class="dots" aria-label="${set5.length} of 5 tries">${[0,1,2,3,4].map(i => `<i class="${i < set5.length ? 'on' : ''}"></i>`).join('')}</div>`;
    const show = (s, big, sub='') => { state = s; b.dataset.s = s; b.innerHTML = `<strong>${big}</strong><span>${sub}</span>${dots()}`; };

  }
});

/* ---------- Fruit Slice (new) ---------- */
game({
  id:'fruit-slice', cat:'aim', title:'Fruit Slice', icon:'🍉', color:'var(--lime)',
  blurb:'Swipe to slice fruit. Avoid the bombs.', how:'Press and drag (or swipe) across fruit to slice it. Don’t slice bombs. Letting 3 fruit fall ends the game.',
  fmt:v => v+' sliced',
  mount(el, api){
    el.classList.add('flush');
    const {c, ctx} = makeCanvas(el); const P = pal();
    const G = c.H*1.4, R = c.W < 500 ? 26 : 32;
    const FRUITS = ['🍎','🍊','🍋','🍉','🍇','🍓','🍑','🍍','🥝','🍌'];
    let items = [], halves = [], trail = [], down = false, last = null, time = 0, waveT = 0.5, score = 0, drops = 0, running = false, over = false, boom = null;
    function toss(bomb){
      const x = c.W*(0.15 + Math.random()*0.7), peak = c.H*(0.45 + Math.random()*0.4);
      const vy = -Math.sqrt(2*G*peak), tf = 2*Math.sqrt(2*peak/G);
      const vx = (c.W/2 - x)/tf*(0.3 + Math.random()*0.9);
      items.push({x, y:c.H + R, vx, vy, r:R, e: bomb ? '💣' : FRUITS[rand(FRUITS.length)], bomb, rot:0, vr:(Math.random() - .5)*5});
    }
    function wave(){
      const n = 1 + rand(Math.min(4, 1 + Math.floor(time/15)));
      const bombChance = Math.min(0.25, 0.08 + time*0.003);
      let bombUsed = false;
      for(let i=0;i<n;i++){ const bomb = i > 0 && !bombUsed && Math.random() < bombChance; if(bomb) bombUsed = true; toss(bomb); }
      if(n === 1 && time > 10 && Math.random() < bombChance) toss(true);
    }
    function slice(a, b){
      for(let i=items.length-1;i>=0;i--){
        const it = items[i];
        if(segDist(a, b, it) <= it.r){
          items.splice(i, 1);
          if(it.bomb){ over = true; boom = {x:it.x, y:it.y, t:0}; api.beep(90, .5); api.after(() => api.end(score, 'You sliced a bomb!'), 600); return; }
          score++; api.beep(650 + rand(200), .04);
          halves.push({x:it.x - 4, y:it.y, vx:it.vx - 70, vy:it.vy*0.3, e:it.e, side:-1, rot:it.rot, vr:-3, r:it.r});
          halves.push({x:it.x + 4, y:it.y, vx:it.vx + 70, vy:it.vy*0.3, e:it.e, side:1, rot:it.rot, vr:3, r:it.r});
        }
      }
    }
    api.on(c, 'pointerdown', e => { if(over) return; down = true; last = ptr(c, e); if(!running) running = true; try{ c.setPointerCapture(e.pointerId); }catch(err){} });
    api.on(c, 'pointermove', e => {
      if(!down || over) return;
      const p = ptr(c, e); slice(last, p); trail.push({x:p.x, y:p.y, t:0}); last = p;
    });
    const up = () => { down = false; last = null; };
    api.on(c, 'pointerup', up); api.on(c, 'pointercancel', up);
    api.loop(dt => {
      if(running && !over){
        time += dt; waveT -= dt;
        if(waveT <= 0){ waveT = Math.max(0.8, 1.7 - time*0.02); wave(); }
      }
      if(!over){
        for(const it of items){ it.vy += G*dt; it.x += it.vx*dt; it.y += it.vy*dt; it.rot += it.vr*dt; }
        const keep = [];
        for(const it of items){
          if(it.vy > 0 && it.y > c.H + it.r*2){ if(!it.bomb){ drops++; api.beep(200, .12); } }
          else keep.push(it);
        }
        items = keep;
        if(drops >= 3){ over = true; api.end(score, '3 fruit hit the floor'); }
      }
      for(const h of halves){ h.vy += G*dt; h.x += h.vx*dt; h.y += h.vy*dt; h.rot += h.vr*dt; }
      halves = halves.filter(h => h.y < c.H + 80);
      trail.forEach(t => t.t += dt); trail = trail.filter(t => t.t < 0.15);
      if(boom) boom.t += dt;

      ctx.clearRect(0, 0, c.W, c.H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for(const it of items){
        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); ctx.font = `${it.r*1.9}px ${EMOJI}`; ctx.fillText(it.e, 0, 0); ctx.restore();
      }
      for(const h of halves){
        ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot);
        ctx.beginPath(); ctx.rect(h.side < 0 ? -h.r*1.2 : 0, -h.r*1.2, h.r*1.2, h.r*2.4); ctx.clip();
        ctx.font = `${h.r*1.9}px ${EMOJI}`; ctx.fillText(h.e, 0, 0); ctx.restore();
      }
      if(trail.length > 1){
        ctx.strokeStyle = P.ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for(let i=1;i<trail.length;i++){ ctx.globalAlpha = 1 - trail[i].t/0.15; ctx.lineWidth = 2 + i*0.6; ctx.beginPath(); ctx.moveTo(trail[i-1].x, trail[i-1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }
      if(boom){ ctx.fillStyle = `rgba(255,140,40,${Math.max(0, 1 - boom.t*2)})`; ctx.beginPath(); ctx.arc(boom.x, boom.y, 30 + boom.t*400, 0, Math.PI*2); ctx.fill(); }
      txt(ctx, score, 16, 40, P.ink, 28, 800, 'left');
      txt(ctx, '✕'.repeat(drops) + '·'.repeat(Math.max(0, 3 - drops)), c.W - 16, 38, P.red, 24, 800, 'right');
      if(!running) txt(ctx, 'Press and drag to slice', c.W/2, c.H/2, P.ink);
    });
  }
});

/* ---------- Stacker ---------- */
game({
  id:'stacker', cat:'arcade', title:'Stacker', icon:'🧱', color:'var(--yellow)',
  blurb:'Drop blocks to build the tallest tower.', how:'Tap, click, or press Space to drop the sliding block. Anything hanging over the edge falls off. The block gets a little faster every 7 floors, up to a top speed.',
  fmt:v => v+' floors',
  mount(el, api){
    el.classList.add('flush');
    const {c, ctx} = makeCanvas(el); const P = pal(); const BH = 26;
    const w0 = Math.min(220, c.W*0.55);
    let blocks = [{x:(c.W - w0)/2, w:w0}], cur, cam = 0, running = false, over = false, debris = [], note = {s:'', t:0};
    const level = () => Math.min(6, Math.floor((blocks.length - 1)/7));
    const speed = () => 170 + level()*38; /* 170 → 398 px/s, then it stops rising */
    const spawn = () => { const top = blocks[blocks.length-1]; const fromLeft = blocks.length % 2 === 1; cur = {x: fromLeft ? 0 : c.W - top.w, w: top.w, dir: fromLeft ? 1 : -1}; };
    spawn();
    const hue = i => `hsl(${(i*17 + 30) % 360} 72% 58%)`;
    const yOf = i => c.H - (i+1)*BH + cam;
    function drop(){
      if(over) return;
      if(!running){ running = true; return; }
      const top = blocks[blocks.length-1], i = blocks.length;
      let l = Math.max(cur.x, top.x), r = Math.min(cur.x + cur.w, top.x + top.w);
      if(r - l <= 0){ over = true; debris.push({x:cur.x, w:cur.w, i, dy:0, vy:0}); api.beep(110, .4); api.after(() => api.end(blocks.length - 1, `Top speed level ${level()+1} of 7`), 600); return; }
      if(Math.abs(cur.x - top.x) < 5){ l = top.x; r = top.x + top.w; note = {s:'Perfect!', t:0.9}; api.beep(880, .12); }
      else {
        api.beep(440, .06);
        if(cur.x < l) debris.push({x:cur.x, w:l - cur.x, i, dy:0, vy:0});
        if(cur.x + cur.w > r) debris.push({x:r, w:cur.x + cur.w - r, i, dy:0, vy:0});
      }
      const before = level();
      blocks.push({x:l, w:r - l});
      if(level() > before) note = {s: level() === 6 ? 'Top speed!' : 'Faster!', t:1.2};
      spawn();
    }
    api.on(c, 'pointerdown', drop);
    api.on(window, 'keydown', e => { if(e.code === 'Space' && !e.repeat && !(e.target.closest && e.target.closest('button,a,input'))) drop(); });
    api.loop(dt => {
      if(running && !over){
        cur.x += cur.dir*speed()*dt;
        if(cur.x < 0){ cur.x = 0; cur.dir = 1; }
        if(cur.x + cur.w > c.W){ cur.x = c.W - cur.w; cur.dir = -1; }
      }
      for(const d of debris){ d.vy += 1400*dt; d.dy += d.vy*dt; }
      debris = debris.filter(d => yOf(d.i) + d.dy < c.H + 60);
      note.t = Math.max(0, note.t - dt);
      cam += (Math.max(0, (blocks.length + 2)*BH - c.H*0.6) - cam)*Math.min(1, dt*8);
      ctx.clearRect(0, 0, c.W, c.H);
      blocks.forEach((b, i) => { const y = yOf(i); if(y > -BH && y < c.H){ ctx.fillStyle = hue(i); ctx.fillRect(b.x, y, b.w, BH - 2); } });
      for(const d of debris){ ctx.fillStyle = hue(d.i); ctx.fillRect(d.x, yOf(d.i) + d.dy, d.w, BH - 2); }
      if(!over){ ctx.fillStyle = hue(blocks.length); ctx.fillRect(cur.x, yOf(blocks.length), cur.w, BH - 2); }
      txt(ctx, blocks.length - 1, 16, 40, P.ink, 28, 800, 'left');
      txt(ctx, `Speed ${level()+1}/7`, c.W - 16, 36, P.muted, 16, 600, 'right');
      if(note.t > 0) txt(ctx, note.s, c.W/2, 70, P.ink, 22, 800);
      if(!running) txt(ctx, 'Tap or press Space to start', c.W/2, c.H/2 - 40, P.ink);
    });
  }
});

/* ---------- Dodge ---------- */
game({
  id:'dodge', cat:'arcade', title:'Dodge', icon:'☄️', color:'var(--green)',
  blurb:'Survive the falling blocks.', how:'Move with your mouse, finger, or arrow keys. Every 30 seconds the blocks fall faster and more of them appear, up to a top level that is still survivable.',
  fmt:v => v.toFixed(1)+' s',
  mount(el, api){
    el.classList.add('flush');
    const {c, ctx} = makeCanvas(el); const P = pal();
    const R = 12, py = c.H - 34, widthF = Math.max(1, 600/c.W), MAXL = 6;
    let px = c.W/2, tx = px, obs = [], time = 0, spawnT = 0, running = false, over = false, lvl = 0, note = 0;
    const keys = {}; api.on(window, 'blur', () => { for(const k in keys) keys[k] = false; });
    api.loop(dt => {
      if(running && !over){
        time += dt;
        const nl = Math.min(MAXL, Math.floor(time/30));
        if(nl > lvl){ lvl = nl; note = 1.8; api.beep(880, .15); }
        if(keys.l) tx -= 430*dt; if(keys.r) tx += 430*dt;
        tx = clamp(tx, R, c.W - R); px += (tx - px)*Math.min(1, dt*16);
        spawnT -= dt;
        if(spawnT <= 0){
          spawnT = Math.max(0.2, 0.62*Math.pow(0.84, lvl))*widthF*(0.8 + Math.random()*0.4);
          const w = 20 + Math.random()*45;
          obs.push({x:Math.random()*(c.W - w), y:-30, w, h:16 + Math.random()*12, v:180*(1 + 0.22*lvl)*(0.85 + Math.random()*0.3)});
        }
        for(const o of obs){
          o.y += o.v*dt;
          const cx = clamp(px, o.x, o.x + o.w), cy = clamp(py, o.y, o.y + o.h);
          if((cx - px)**2 + (cy - py)**2 < R*R && !over){ over = true; api.beep(110, .4); api.end(Math.round(time*10)/10, `Reached level ${lvl+1}`); }
        }
        obs = obs.filter(o => o.y < c.H + 40);
      }
      note = Math.max(0, note - dt);
      ctx.clearRect(0, 0, c.W, c.H);
      ctx.fillStyle = P.red; obs.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));
      ctx.fillStyle = P.green; ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI*2); ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = P.ink; ctx.stroke();
      txt(ctx, time.toFixed(1) + 's', 16, 40, P.ink, 28, 800, 'left');
      txt(ctx, `Level ${lvl+1}${lvl === MAXL ? ' (max)' : ''}`, c.W - 16, 36, P.muted, 16, 600, 'right');
      if(note > 0) txt(ctx, lvl === MAXL ? 'Top level!' : 'Faster! More blocks!', c.W/2, 80, P.ink, 22, 800);
      if(!running) txt(ctx, 'Tap or press Space to start', c.W/2, c.H/2, P.ink);
    });
    const setX = e => { tx = ptr(c, e).x; };
    api.on(c, 'pointermove', setX);
    api.on(c, 'pointerdown', e => { setX(e); if(!over) running = true; });
    api.on(window, 'keydown', e => {
      if(e.target.closest && e.target.closest('button,a,input')) return;
      if(e.ctrlKey || e.metaKey || e.altKey) return;
      if(e.key === 'ArrowLeft' || e.code === 'KeyA'){ keys.l = true; if(!over) running = true; }
      if(e.key === 'ArrowRight' || e.code === 'KeyD'){ keys.r = true; if(!over) running = true; }
      if(e.code === 'Space' && !over) running = true;
    });
    api.on(window, 'keyup', e => { if(e.key === 'ArrowLeft' || e.code === 'KeyA') keys.l = false; if(e.key === 'ArrowRight' || e.code === 'KeyD') keys.r = false; });
  }
});

/* ---------- Slither ---------- */
game({
  id:'slither', cat:'arcade', title:'Slither', icon:'🐍', color:'var(--green)',
  blurb:'Eat fruit, grow, don’t bite your tail.', how:'Use the arrow keys, WASD, or swipe. Eat the fruit to grow. Don’t hit the walls or yourself. The board is the classic 17 × 15 snake size.',
  modes:[{id:'slow', label:'Slow'}, {id:'normal', label:'Normal', def:true}, {id:'fast', label:'Fast'}],
  fmt:v => v+' fruit',
  mount(el, api, mode){
    el.classList.add('flush');
    const {c, ctx} = makeCanvas(el); const P = pal(); const fx = particles();
    const cols = 17, rows = 15;
    const S = Math.floor(Math.min((c.W - 16)/cols, (c.H - 60)/rows));
    const ox = Math.floor((c.W - cols*S)/2), oy = 52 + Math.floor((c.H - 56 - rows*S)/2);
    const base = {slow:170, normal:135, fast:100}[mode] || 135;
    const FRUIT = ['🍎','🍊','🍇','🍓','🍒','🍌','🍑','🍉'];
    let snake = [{x:4, y:7}, {x:3, y:7}, {x:2, y:7}], prev = snake.map(s => ({...s}));
    let dir = {x:1, y:0}, queue = [], food, fruit, score = 0, running = false, over = false, acc = 0, steps = 0, pulse = 0;
    const place = () => { do{ food = {x:rand(cols), y:rand(rows)}; }while(snake.some(s => s.x === food.x && s.y === food.y)); fruit = FRUIT[rand(FRUIT.length)]; };
    place();
    const interval = () => Math.max(60, base - score*2);
    function step(){
      if(queue.length) dir = queue.shift();
      const h = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};
      const eats = h.x === food.x && h.y === food.y;
      const body = eats ? snake : snake.slice(0, -1);
      if(h.x < 0 || h.y < 0 || h.x >= cols || h.y >= rows || body.some(s => s.x === h.x && s.y === h.y)){
        over = true; prev = snake.map(s => ({...s})); api.sfx.boom(); api.shake();
        fx.burst(ox + snake[0].x*S + S/2, oy + snake[0].y*S + S/2, P.green, 26, 220);
        api.after(() => api.end(score, `Length ${snake.length}`), 600); return;
      }
      prev = snake.map(s => ({...s}));
      snake.unshift(h); steps++;
      if(eats){
        score++; pulse = 0.25; api.sfx.coin(); fx.burst(ox + h.x*S + S/2, oy + h.y*S + S/2, P.red, 14, 160);
        if(snake.length >= cols*rows){ over = true; api.end(score, 'You filled the whole board!'); return; }
        place();
      } else snake.pop();
    }
    function turn(d){
      if(over) return;
      const lastD = queue.length ? queue[queue.length-1] : dir;
      const reverse = d.x === -lastD.x && d.y === -lastD.y, same = d.x === lastD.x && d.y === lastD.y;
      if(!running && reverse){ snake.reverse(); prev = snake.map(s => ({...s})); dir = d; queue = []; running = true; return; }
      if(!reverse && !same && queue.length < 3) queue.push(d);
      if(!running) running = true;
    }
    api.loop(dt => {
      if(running && !over){ acc += dt*1000; while(acc >= interval() && !over){ acc -= interval(); step(); } }
      const f = running && !over ? clamp(acc/interval(), 0, 1) : 1;
      pulse = Math.max(0, pulse - dt); fx.update(dt);
      ctx.clearRect(0, 0, c.W, c.H);
      /* board */
      ctx.fillStyle = P.line; ctx.fillRect(ox - 4, oy - 4, cols*S + 8, rows*S + 8);
      for(let x=0;x<cols;x++) for(let y=0;y<rows;y++){ ctx.fillStyle = (x + y) % 2 ? P.surface : P.bg; ctx.fillRect(ox + x*S, oy + y*S, S, S); }
      /* fruit (gently bobbing) */
      const bob = Math.sin(performance.now()/250)*1.5;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `${S*0.9}px ${EMOJI}`;
      ctx.fillText(fruit, ox + food.x*S + S/2, oy + food.y*S + S/2 + 1 + bob);
      /* body: interpolated between the last two grid positions so it glides */
      const pts = snake.map((s, i) => { const o = prev[i] || s; return {x: ox + (o.x + (s.x - o.x)*f)*S + S/2, y: oy + (o.y + (s.y - o.y)*f)*S + S/2}; });
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const n = pts.length;
      for(let i=n-1;i>0;i--){
        ctx.lineWidth = S*(0.45 + 0.4*(1 - i/n)) + (i < 3 ? pulse*S*0.6 : 0);
        ctx.strokeStyle = i % 2 ? '#3f9f43' : '#2f7d33';
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i-1].x, pts[i-1].y); ctx.stroke();
      }
      /* head */
      const hx = pts[0].x, hy = pts[0].y, fx2 = dir.x, fy2 = dir.y, sx = -fy2, sy = fx2;
      if(steps % 6 < 2 && !over){
        ctx.strokeStyle = '#e5533d'; ctx.lineWidth = 2; ctx.beginPath();
        const tx = hx + fx2*S*0.75, ty = hy + fy2*S*0.75;
        ctx.moveTo(hx + fx2*S*0.4, hy + fy2*S*0.4); ctx.lineTo(tx, ty);
        ctx.lineTo(tx + fx2*S*0.15 + sx*S*0.12, ty + fy2*S*0.15 + sy*S*0.12);
        ctx.moveTo(tx, ty); ctx.lineTo(tx + fx2*S*0.15 - sx*S*0.12, ty + fy2*S*0.15 - sy*S*0.12); ctx.stroke();
      }
      ctx.fillStyle = '#2f7d33'; ctx.beginPath(); ctx.arc(hx + fx2*2, hy + fy2*2, S*0.52, 0, Math.PI*2); ctx.fill();
      for(const side of [-1, 1]){
        const ex = hx + fx2*S*0.15 + sx*S*0.22*side, ey = hy + fy2*S*0.15 + sy*S*0.22*side;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, S*0.14, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex + fx2*S*0.04, ey + fy2*S*0.04, S*0.07, 0, Math.PI*2); ctx.fill();
      }
      fx.draw(ctx);
      txt(ctx, '🍎 ' + score, 16, 36, P.ink, 24, 800, 'left');
      txt(ctx, `${cols} × ${rows}`, c.W - 16, 34, P.muted, 14, 600, 'right');
      if(!running) txt(ctx, 'Press an arrow key or swipe to start', c.W/2, oy + rows*S/2 - S*2, P.ink);
    });
    const DIRS = {ArrowUp:{x:0,y:-1}, KeyW:{x:0,y:-1}, ArrowDown:{x:0,y:1}, KeyS:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, KeyA:{x:-1,y:0}, ArrowRight:{x:1,y:0}, KeyD:{x:1,y:0}};
    api.on(window, 'keydown', e => { const d = DIRS[e.code]; if(d && !e.ctrlKey && !e.metaKey && !e.altKey && !(e.target.closest && e.target.closest('input'))){ e.preventDefault(); turn(d); } });
    onSwipe(api, c, s => turn({U:{x:0,y:-1}, D:{x:0,y:1}, L:{x:-1,y:0}, R:{x:1,y:0}}[s]));
  }
});

game({
  id:'sky-hopper', cat:'arcade', title:'Sky Hopper', icon:'🐤', color:'var(--yellow)',

      ctx.fillStyle = P.orange; ctx.beginPath(); ctx.moveTo(R - 2, -2); ctx.lineTo(R + 8, 1); ctx.lineTo(R - 2, 5); ctx.fill();
      ctx.restore();
      txt(ctx, score, 16, 40, P.ink, 28, 800, 'left');
      if(!running) txt(ctx, 'Tap or press Space to flap', c.W/2, c.H/2 - 50, P.ink);
    });

          ctx.fillStyle = P.purple; ctx.beginPath(); ctx.moveTo(bx + 14, bt + 9); ctx.lineTo(bx + 30, bt + 9); ctx.lineTo(bx + 22, up ? bt - 10 : bt + 28); ctx.fill();

        }

      const hb = hitbox(), top = gy - y - hb.h;
      ctx.fillStyle = P.blue; ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(px, top, hb.w, hb.h - 7, 8); else ctx.rect(px, top, hb.w, hb.h - 7);
      ctx.fill();

      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(px + hb.w - 8, top + 8, 2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = P.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';

    });
    api.on(c, 'pointerdown', e => { if(over) return; const p = ptr(c, e); if(p.y > c.H/2){ touchDuck = true; running = true; } else jump(); });
    const up = () => { touchDuck = false; };
    api.on(c, 'pointerup', up); api.on(c, 'pointercancel', up); api.on(c, 'pointerleave', up);

/* ---------- Brick Breaker ---------- */
game({
  id:'brick-breaker', cat:'arcade', title:'Brick Breaker', icon:'🧨', color:'var(--blue)',
  blurb:'Smash bricks, grab power-ups, beat the wall.', how:'Move the paddle with your mouse, finger, or arrow keys. Click or press Space to launch. Some bricks drop power-ups: catch them for a wide paddle, multi-ball, slow-mo, a fireball, or an extra life. Avoid the red shrink capsule. Dark bricks take 2 or 3 hits, the ball speeds up, and the wall creeps down every 20 seconds. 3 lives.',
  fmt:v => v+' bricks',
  mount(el, api){
    el.classList.add('flush');
    const {c, ctx} = makeCanvas(el); const P = pal(); const fx = particles();
    const basePW = c.W < 500 ? 76 : 100, ph = 12, py = c.H - 34, br = 7;
    const cols = clamp(Math.floor((c.W - 20)/64), 5, 10), gap = 6, bw = (c.W - 20 - (cols - 1)*gap)/cols, bh = 18;
    const HUES = [P.red, P.orange, P.yellow, P.green, P.sky, P.purple, P.pink];
    const CAPS = {
      wide:{c:P.green, l:'↔', label:'Wide paddle!', w:24},
      multi:{c:P.purple, l:'✦', label:'Multi-ball!', w:20},
      slow:{c:P.sky, l:'≈', label:'Slow-mo!', w:16},
      fire:{c:P.orange, l:'✹', label:'Fireball!', w:12},
      life:{c:P.pink, l:'♥', label:'Extra life!', w:7},
      shrink:{c:P.red, l:'↘', label:'Tiny paddle!', w:21}
    };
    const CAP_KEYS = Object.keys(CAPS), CAP_TOTAL = CAP_KEYS.reduce((a, k) => a + CAPS[k].w, 0);
    let px = c.W/2, tx = px, balls = [], stuck = true, speed = 320, lives = 3, score = 0, wave = 1, over = false, bricks = [], caps = [], top = 56, creepT = 0, banner = {s:'', t:0};
    const eff = {wide:0, slow:0, fire:0, shrink:0};
    const keys = {}; api.on(window, 'blur', () => { for(const k in keys) keys[k] = false; });
    const pw = () => basePW*(eff.wide > 0 ? 1.5 : 1)*(eff.shrink > 0 ? 0.6 : 1);
    const by = b => top + b.r*(bh + gap);
    function build(){
      bricks = []; top = 56; creepT = 0;
      const rows = Math.min(7, 4 + wave);
      for(let r=0;r<rows;r++) for(let k=0;k<cols;k++){
        let hp = 1;
        if(wave >= 2 && Math.random() < Math.min(0.45, 0.12*wave)) hp = 2;
        if(wave >= 3 && Math.random() < Math.min(0.25, 0.05*wave)) hp = 3;
        bricks.push({x:10 + k*(bw + gap), r, hp, max:hp, alive:true});
      }
    }
    function reset(){ stuck = true; balls = [{x:px, y:py - br - 1, vx:0, vy:0}]; }
    function launch(){ if(over || !stuck) return; stuck = false; const a = -Math.PI/2 + (Math.random() - .5)*0.6; balls[0].vx = Math.cos(a)*speed; balls[0].vy = Math.sin(a)*speed; api.sfx.jump(); }
    function norm(b){
      const m = Math.hypot(b.vx, b.vy) || 1; b.vx = b.vx/m*speed; b.vy = b.vy/m*speed;
      if(Math.abs(b.vy) < speed*0.3){ b.vy = (b.vy < 0 ? -1 : 1)*speed*0.3; b.vx = (b.vx < 0 ? -1 : 1)*Math.sqrt(speed*speed - b.vy*b.vy); }
    }
    function drop(b){
      let r = Math.random()*CAP_TOTAL, t = CAP_KEYS[0];
      for(const k of CAP_KEYS){ r -= CAPS[k].w; if(r <= 0){ t = k; break; } }
      caps.push({x:b.x + bw/2, y:by(b) + bh/2, type:t});
    }
    function apply(t){
      if(t === 'multi'){
        const src = balls[0];
        if(src && !stuck){ const a0 = Math.atan2(src.vy, src.vx); for(const s of [-0.4, 0.4]) balls.push({x:src.x, y:src.y, vx:Math.cos(a0 + s)*speed, vy:Math.sin(a0 + s)*speed}); balls.forEach(norm); }
      } else if(t === 'life') lives = Math.min(5, lives + 1);
      else if(t === 'wide'){ eff.wide = 12; eff.shrink = 0; }
      else if(t === 'shrink'){ eff.shrink = 10; eff.wide = 0; }
      else if(t === 'slow') eff.slow = 8;
      else if(t === 'fire') eff.fire = 6;
      banner = {s:CAPS[t].label, t:1.3};
      if(t === 'shrink') api.sfx.miss(); else api.sfx.power();
    }
    function breakBrick(b){
      b.hp = eff.fire > 0 ? 0 : b.hp - 1;
      if(b.hp <= 0){
        b.alive = false; score++;
        fx.burst(b.x + bw/2, by(b) + bh/2, HUES[b.r % HUES.length], 12);
        api.beep(500 + b.r*60, .04);
        if(Math.random() < 0.15) drop(b);
      } else api.beep(240, .05);
      speed = Math.min(600, speed + 3);
    }
    build(); reset();
    api.on(c, 'pointermove', e => { tx = ptr(c, e).x; });
    api.on(c, 'pointerdown', e => { tx = ptr(c, e).x; launch(); });
    api.on(window, 'keydown', e => {
      if((e.target.closest && e.target.closest('button,a,input')) || e.ctrlKey || e.metaKey || e.altKey) return;
      if(e.key === 'ArrowLeft' || e.code === 'KeyA') keys.l = true;
      if(e.key === 'ArrowRight' || e.code === 'KeyD') keys.r = true;
      if(e.code === 'Space' || e.key === 'ArrowUp') launch();
    });
    api.on(window, 'keyup', e => { if(e.key === 'ArrowLeft' || e.code === 'KeyA') keys.l = false; if(e.key === 'ArrowRight' || e.code === 'KeyD') keys.r = false; });
    api.loop(dt => {
      for(const k in eff) eff[k] = Math.max(0, eff[k] - dt);
      banner.t = Math.max(0, banner.t - dt);
      const W2 = pw()/2;
      if(!over){
        if(keys.l) tx -= 560*dt; if(keys.r) tx += 560*dt;
        tx = clamp(tx, W2, c.W - W2); px += (tx - px)*Math.min(1, dt*20); px = clamp(px, W2, c.W - W2);
      }
      if(stuck && balls[0]){ balls[0].x = px; balls[0].y = py - br - 1; }

        const sf = eff.slow > 0 ? 0.6 : 1, N = 4;
        creepT += dt;
        if(creepT >= 20){ creepT = 0; top += bh + gap; banner = {s:'The wall moves down!', t:1.3}; api.sfx.level(); }
        for(const b of balls){
          for(let s=0;s<N;s++){
            b.x += b.vx*sf*dt/N; b.y += b.vy*sf*dt/N;
            if(b.x < br){ b.x = br; b.vx = Math.abs(b.vx); }
            if(b.x > c.W - br){ b.x = c.W - br; b.vx = -Math.abs(b.vx); }
            if(b.y < br){ b.y = br; b.vy = Math.abs(b.vy); }
            if(b.vy > 0 && b.y + br >= py && b.y + br <= py + ph + 10 && b.x >= px - W2 - br && b.x <= px + W2 + br){
              const off = clamp((b.x - px)/W2, -1, 1), a = off*1.05;
              b.vx = Math.sin(a)*speed; b.vy = -Math.cos(a)*speed; b.y = py - br; api.beep(400, .03);
            }
            for(const k of bricks){
              if(!k.alive) continue;
              const ky = by(k), qx = clamp(b.x, k.x, k.x + bw), qy = clamp(b.y, ky, ky + bh);
              if((b.x - qx)**2 + (b.y - qy)**2 <= br*br){
                const fire = eff.fire > 0;
                breakBrick(k);
                if(!fire){
                  const ovx = Math.min(b.x + br - k.x, k.x + bw - (b.x - br)), ovy = Math.min(b.y + br - ky, ky + bh - (b.y - br));
                  if(ovx < ovy){ const s = b.x < k.x + bw/2 ? -1 : 1; b.vx = s*Math.abs(b.vx); b.x = s < 0 ? k.x - br - 0.5 : k.x + bw + br + 0.5; }
                  else { const s = b.y < ky + bh/2 ? -1 : 1; b.vy = s*Math.abs(b.vy); b.y = s < 0 ? ky - br - 0.5 : ky + bh + br + 0.5; }
                  norm(b); break;
                }
              }
            }
            if(b.y - br > c.H){ b.dead = true; break; }
          }
        }
        balls = balls.filter(b => !b.dead);
        if(!balls.length){
          lives--; api.sfx.lose(); api.shake(); eff.wide = eff.slow = eff.fire = eff.shrink = 0; caps = [];
          if(lives <= 0){ over = true; api.end(score, `Reached wave ${wave}`); } else reset();
        }
        for(const cp of caps){
          cp.y += 150*dt;
          if(cp.y + 9 >= py && cp.y - 9 <= py + ph && Math.abs(cp.x - px) <= W2 + 12){ cp.dead = true; apply(cp.type); fx.burst(cp.x, py, CAPS[cp.type].c, 14); }
          if(cp.y > c.H + 20) cp.dead = true;
        }
        caps = caps.filter(cp => !cp.dead);
        const alive = bricks.filter(k => k.alive);
        if(!over && alive.length && Math.max(...alive.map(k => by(k) + bh)) >= py - 24){ over = true; api.sfx.boom(); api.shake(); api.end(score, 'The wall reached your paddle'); }
        if(!over && !alive.length){ wave++; speed = Math.min(600, 320 + wave*25); build(); reset(); caps = []; banner = {s:`Wave ${wave}`, t:1.5}; api.sfx.level(); }
      }
      fx.update(dt);
      ctx.clearRect(0, 0, c.W, c.H);
      for(const k of bricks) if(k.alive){
        const ky = by(k);
        ctx.fillStyle = HUES[k.r % HUES.length]; ctx.fillRect(k.x, ky, bw, bh);
        if(k.max > 1){

        ctx.fill(); ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.stroke();
        txt(ctx, CAPS[cp.type].l, cp.x, cp.y + 5, '#fff', 14, 800);
      }
      ctx.fillStyle = eff.shrink > 0 ? P.red : eff.wide > 0 ? P.green : P.ink;
      ctx.fillRect(px - W2, py, W2*2, ph);
      for(const b of balls){

        ctx.fillStyle = eff.fire > 0 ? P.orange : P.ink; ctx.beginPath(); ctx.arc(b.x, b.y, br, 0, Math.PI*2); ctx.fill();

    });
  }

/* ---------- Paddle Duel (new) ---------- */
game({

  mount(el, api){
    el.classList.add('flush');

    });

            ball.x += ball.vx*dt/N; ball.y += ball.vy*dt/N;
            if(ball.y < br){ ball.y = br; ball.vy = Math.abs(ball.vy); }

      ctx.fillStyle = P.red; ctx.fillRect(rx, cy - ph/2, pw, ph);
      ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(ball.x, ball.y, br, 0, Math.PI*2); ctx.fill();
      if(!running) txt(ctx, 'Click or press Space to start', c.W/2, c.H/2 + 50, P.ink, 18);
    });
  }
});

/* ---------- Tile Merge ---------- */
game({

  blurb:'Slide and merge matching numbers.', how:'Use the arrow keys, WASD, or swipe on the board to slide every tile. Two matching tiles merge into one. You get one undo per move.',
  fmt:v => v+' pts',
  mount(el, api){
    el.classList.add('tight');
    el.innerHTML = '<div class="hud"><span>Score <b class="c">0</b></span><span>Best tile <b class="bt">2</b></span><button class="btn sm undo" type="button" disabled>↶ Undo</button></div><div class="merge"></div>';
    const grid = $('.merge', el), cEl = $('.c', el), btEl = $('.bt', el), undoB = $('.undo', el);
    let b = Array(16).fill(0), score = 0, over = false, prev = null, fresh = -1;
    const cells = b.map(() => { const d = document.createElement('div'); grid.appendChild(d); return d; });
    function add(){ const empty = b.map((v, i) => v ? -1 : i).filter(i => i >= 0); if(empty.length){ fresh = empty[rand(empty.length)]; b[fresh] = Math.random() < 0.9 ? 2 : 4; } }
    function render(){
      b.forEach((v, i) => {
        const d = cells[i]; d.textContent = v || '';
        d.style.background = v ? `hsl(${(Math.log2(v)*32 + 20) % 360} 80% 72%)` : '';
        d.style.color = v ? '#1f1b16' : '';
        d.className = (v >= 1024 ? 'big' : '') + (i === fresh ? ' n' : '');
      });
      cEl.textContent = score; btEl.textContent = Math.max(...b); undoB.disabled = !prev || over;
    }
    function slide(line){
      const a = line.filter(v => v), out = []; let gained = 0;
      for(let i=0;i<a.length;i++){ if(a[i] === a[i+1]){ out.push(a[i]*2); gained += a[i]*2; i++; } else out.push(a[i]); }
      while(out.length < 4) out.push(0);
      return {out, gained};
    }
    function canMove(){
      for(let i=0;i<16;i++){ if(!b[i]) return true; if(i%4 < 3 && b[i] === b[i+1]) return true; if(i < 12 && b[i] === b[i+4]) return true; }
      return false;
    }
    function move(d){
      if(over) return;
      let moved = false, gained = 0; const nb = b.slice();
      for(let k=0;k<4;k++){
        const idx = [0,1,2,3].map(i => d === 'L' ? k*4 + i : d === 'R' ? k*4 + 3 - i : d === 'U' ? i*4 + k : (3 - i)*4 + k);
        const res = slide(idx.map(i => b[i])); gained += res.gained;
        idx.forEach((i, j) => { if(nb[i] !== res.out[j]) moved = true; nb[i] = res.out[j]; });
      }
      if(!moved) return;
      prev = {b:b.slice(), score};
      b = nb; score += gained; if(gained) api.beep(300 + Math.min(900, gained), .05);
      add(); render();
      if(!canMove()){ over = true; render(); api.after(() => api.end(score, `Best tile ${Math.max(...b)}`), 500); }
    }
    api.on(undoB, 'click', () => { if(!prev || over) return; b = prev.b; score = prev.score; prev = null; fresh = -1; render(); });
    const KEYS = {ArrowUp:'U', ArrowDown:'D', ArrowLeft:'L', ArrowRight:'R', KeyW:'U', KeyS:'D', KeyA:'L', KeyD:'R'};
    api.on(window, 'keydown', e => { const d = KEYS[e.code]; if(d && !e.ctrlKey && !e.metaKey && !e.altKey && !(e.target.closest && e.target.closest('input'))){ e.preventDefault(); move(d); } });
    onSwipe(api, grid, move);
    add(); add(); render();
  }
});

game({
  id:'sweeper', cat:'puzzle', title:'Sweeper', icon:'💣', color:'var(--sky)',
  blurb:'Clear the field without hitting a mine.', how:'Click a square to open it. A number shows how many mines touch that square directly: above, below, left, or right (not diagonal). Right-click, long-press, or use Flag mode to mark mines. Click an opened number whose flags are all placed to open the rest around it.',
  modes:[{id:'easy', label:'Easy'}, {id:'medium', label:'Medium', def:true}, {id:'hard', label:'Hard'}],
  lower:true, fmt:v => v+' s',
  mount(el, api, mode){
    const cfg = {easy:{N:9, M:12}, medium:{N:12, M:24}, hard:{N:14, M:36}}[mode] || {N:12, M:24};
    const N = cfg.N, M = cfg.M;
    el.innerHTML = `<div class="hud"><span>Mines <b class="c">${M}</b></span><span>Time <b class="t">0</b></span><button class="btn sm flagbtn" type="button" aria-pressed="false">🚩 Flag mode</button></div><div class="tiles mines"></div>`;
    const grid = $('.mines', el), cEl = $('.c', el), tEl = $('.t', el), fb = $('.flagbtn', el);
    gridN(grid, N); grid.style.fontSize = clamp(Math.round(240/N), 11, 22) + 'px';
    const NUMC = ['', 'var(--blue)', 'var(--green)', 'var(--red)', 'var(--purple)'];
    let cells = [], first = true, over = false, flagMode = false, start = 0, opened = 0, flags = 0;
    const nbrs = i => { const x = i%N, y = Math.floor(i/N), out = []; if(y > 0) out.push(i - N); if(y < N-1) out.push(i + N); if(x > 0) out.push(i - 1); if(x < N-1) out.push(i + 1); return out; };
    for(let i=0;i<N*N;i++){
      const btn = document.createElement('button'); btn.type = 'button'; btn.setAttribute('aria-label', `Square ${i%N + 1}, ${Math.floor(i/N) + 1}`);
      const cell = {mine:false, adj:0, open:false, flag:false, btn}; cells.push(cell);
      let lp = null, longPressed = false;
      const cancelLp = () => { if(lp){ api.cancel(lp); lp = null; } };
      api.on(btn, 'pointerdown', e => { longPressed = false; cancelLp(); if(e.pointerType !== 'mouse'){ lp = api.after(() => { lp = null; longPressed = true; flag(i); }, 420); } });
      api.on(btn, 'pointerup', cancelLp); api.on(btn, 'pointerleave', cancelLp); api.on(btn, 'pointercancel', cancelLp);
      api.on(btn, 'contextmenu', e => {
        e.preventDefault();
        if(longPressed) return;               /* the long-press timer already flagged it */
        const touch = lp !== null; cancelLp(); /* touch long-press menu arrived first */
        if(touch) longPressed = true;
        flag(i);
      });
      api.on(btn, 'click', () => { if(longPressed){ longPressed = false; return; } flagMode ? flag(i) : open(i); });
      grid.appendChild(btn);
    }
    function lay(safe){
      const banned = new Set([safe, ...nbrs(safe)]); let placed = 0;
      while(placed < M){ const r = rand(N*N); if(!banned.has(r) && !cells[r].mine){ cells[r].mine = true; placed++; } }
      cells.forEach((c, i) => c.adj = nbrs(i).filter(j => cells[j].mine).length);
    }
    function paint(c){
      const b = c.btn;
      if(c.open){ b.classList.add('open'); b.textContent = c.mine ? '💣' : (c.adj || ''); b.style.color = NUMC[c.adj] || ''; }
      else b.textContent = c.flag ? '🚩' : '';
    }
    function flag(i){
      const c = cells[i]; if(over || c.open) return;
      c.flag = !c.flag; flags += c.flag ? 1 : -1; cEl.textContent = M - flags; paint(c);
    }
    function open(i){
      const c = cells[i]; if(over || c.flag) return;
      if(c.open){
        if(c.adj > 0){ const ns = nbrs(i); if(ns.filter(j => cells[j].flag).length === c.adj) ns.forEach(j => { if(!cells[j].open) open(j); }); }
        return;
      }
      if(first){ first = false; lay(i); start = Date.now(); api.every(() => { if(!over) tEl.textContent = Math.floor((Date.now() - start)/1000); }, 250); }
      if(c.mine){
        over = true; api.beep(110, .5);
        cells.forEach(x => { if(x.mine){ x.open = true; paint(x); } });
        c.btn.classList.add('boom');
        api.after(() => api.fail('Boom! 💥', 'You opened a mine.'), 700); return;
      }
      const stack = [i];
      while(stack.length){
        const k = stack.pop(), x = cells[k]; if(x.open || x.flag) continue;
        x.open = true; opened++; paint(x);
        if(x.adj === 0) nbrs(k).forEach(j => { if(!cells[j].open && !cells[j].mine) stack.push(j); });
      }
      api.beep(520, .03);
      if(opened === N*N - M){ over = true; cells.forEach(x => { if(x.mine && !x.flag){ x.flag = true; paint(x); } }); api.end(Math.max(1, Math.round((Date.now() - start)/1000))); }
    }
    api.on(fb, 'click', () => { flagMode = !flagMode; fb.setAttribute('aria-pressed', String(flagMode)); });
  }
});

game({
  id:'number-rush', cat:'puzzle', title:'Number Rush', icon:'🔢', color:'var(--orange)',
  blurb:'Tap numbers in order. One wrong tap and you’re out.', how:'Tap the numbers in order starting at 1. Each round adds one more number, starting with 5. You have 60 seconds. Tapping the wrong number ends the game.',
  fmt:v => v+' taps',
  mount(el, api){
    el.innerHTML = '<div class="hud"><span>Time <b class="t">60</b></span><span>Round <b class="r">1</b></span><span>Score <b class="c">0</b></span></div><div class="tiles nums"></div><p class="msg">Tap 1 to start the clock.</p>';
    const grid = $('.nums', el), tEl = $('.t', el), rEl = $('.r', el), cEl = $('.c', el), msg = $('.msg', el);
    gridN(grid, 5);
    const cells = Array.from({length:25}, () => { const b = document.createElement('button'); b.type = 'button'; grid.appendChild(b); return b; });
    let round = 1, next = 1, count = 5, score = 0, start = 0, over = false, busy = false;
    function deal(){
      count = Math.min(25, 4 + round); next = 1; busy = false;
      const slots = shuffle([...Array(25).keys()]).slice(0, count);
      cells.forEach(b => { b.textContent = ''; b.className = 'empty'; b.disabled = true; b.dataset.n = ''; b.removeAttribute('aria-label'); });
      slots.forEach((s, i) => { const b = cells[s]; b.textContent = i + 1; b.dataset.n = i + 1; b.className = ''; b.disabled = false; b.setAttribute('aria-label', 'Number ' + (i+1)); });
      rEl.textContent = round;
    }
    function tick(){
      if(over) return;
      const left = 60 - (Date.now() - start)/1000; tEl.textContent = Math.max(0, Math.ceil(left));
      if(left <= 0){ over = true; api.end(score, `Time’s up! You reached round ${round}.`); }
    }
    cells.forEach(b => api.on(b, 'pointerdown', e => {
      e.preventDefault();
      if(over || busy || !b.dataset.n || b.disabled) return;
      const n = +b.dataset.n;
      if(n !== next){
        over = true; b.classList.add('wrong'); api.beep(110, .4); msg.textContent = `Wrong! You tapped ${n}, but ${next} was next.`;
        api.after(() => api.end(score, `Wrong number: tapped ${n} instead of ${next}`), 700); return;
      }
      if(!start){ start = Date.now(); msg.textContent = 'Go go go!'; api.every(tick, 100); }
      b.classList.add('done'); b.disabled = true; next++; score++; cEl.textContent = score; api.beep(480 + n*18, .04);
      if(next > count){ busy = true; round++; api.after(deal, 220); }
    }));
    deal();
  }
});

      const n = 1 + rand(100), ok = n === cur || (up ? n > cur : n < cur);

    api.on($('.hi', el), 'click', () => guess(true));
    api.on($('.lo', el), 'click', () => guess(false));
    api.on(window, 'keydown', e => {

    const padsEl = $('.pads', el), cEl = $('.c', el), go = $('.go', el);
    let seq = [], idx = 0, accept = false, over = false;
    const pads = cols.map((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.textContent = i + 1; b.setAttribute('aria-label', 'Pad ' + (i+1)); b.disabled = true;
      api.on(b, 'pointerdown', () => press(i)); padsEl.appendChild(b); return b;

    function next(){
      accept = false; pads.forEach(p => p.disabled = true);
      seq.push(rand(4)); idx = 0; cEl.textContent = seq.length;

      idx++;
      if(idx === seq.length){ accept = false; api.after(next, 700); }
    }
    api.on(window, 'keydown', e => { if(/^[1-4]$/.test(e.key) && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) press(+e.key - 1); });
    api.on(go, 'click', () => { go.remove(); next(); });
  }

/* ---------- Tic-Tac-Toe ---------- */
const LINES3 = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(b){
  for(const [a,c,d] of LINES3) if(b[a] && b[a] === b[c] && b[a] === b[d]) return {p:b[a], line:[a,c,d]};
  return b.every(v => v) ? {p:'draw', line:[]} : null;
}
function tttBest(b, me){
  const opp = me === 'X' ? 'O' : 'X';
  const mm = (turn, depth) => {
    const w = tttWinner(b);
    if(w) return w.p === 'draw' ? 0 : (w.p === me ? 10 - depth : depth - 10);
    let best = turn === me ? -99 : 99;
    for(let i=0;i<9;i++) if(!b[i]){
      b[i] = turn; const s = mm(turn === me ? opp : me, depth + 1); b[i] = '';
      best = turn === me ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  };
  let bestS = -99, moves = [];
  for(let i=0;i<9;i++) if(!b[i]){
    b[i] = me; const s = mm(opp, 1); b[i] = '';
    if(s > bestS){ bestS = s; moves = [i]; } else if(s === bestS) moves.push(i);
  }
  return moves[rand(moves.length)];
}

/* ---------- Connect Four ---------- */
const C4R = 6, C4C = 7, C4ORDER = [3,2,4,1,5,0,6], C4DIRS = [[0,1],[1,0],[1,1],[1,-1]];
const c4Drop = (b, c) => { for(let r=C4R-1;r>=0;r--) if(!b[r*C4C + c]) return r; return -1; };
function c4Line(b, r, c){
  const p = b[r*C4C + c];
  for(const [dr, dc] of C4DIRS){
    const cells = [r*C4C + c];
    for(const s of [1, -1]){
      let rr = r + dr*s, cc = c + dc*s;
      while(rr >= 0 && rr < C4R && cc >= 0 && cc < C4C && b[rr*C4C + cc] === p){ cells.push(rr*C4C + cc); rr += dr*s; cc += dc*s; }
    }
    if(cells.length >= 4) return cells;
  }
  return null;
}
function c4Eval(b, me){
  const opp = 3 - me; let s = 0;
  for(let r=0;r<C4R;r++){ const v = b[r*C4C + 3]; if(v === me) s += 3; else if(v === opp) s -= 3; }
  for(let r=0;r<C4R;r++) for(let c=0;c<C4C;c++) for(const [dr, dc] of C4DIRS){
    const er = r + 3*dr, ec = c + 3*dc;
    if(er < 0 || er >= C4R || ec < 0 || ec >= C4C) continue;
    let m = 0, o = 0;
    for(let k=0;k<4;k++){ const v = b[(r + k*dr)*C4C + c + k*dc]; if(v === me) m++; else if(v === opp) o++; }
    if(m && o) continue;
    if(m === 3) s += 5; else if(m === 2) s += 2;
    else if(o === 3) s -= 4; else if(o === 2) s -= 1;
  }
  return s;
}
function c4Negamax(b, depth, alpha, beta, p, me){
  if(depth === 0) return (p === me ? 1 : -1)*c4Eval(b, me);
  let best = -Infinity, any = false;
  for(const c of C4ORDER){
    const r = c4Drop(b, c); if(r < 0) continue; any = true;
    b[r*C4C + c] = p;
    const v = c4Line(b, r, c) ? 1000 + depth : -c4Negamax(b, depth - 1, -beta, -alpha, 3 - p, me);
    b[r*C4C + c] = 0;
    if(v > best) best = v;
    if(best > alpha) alpha = best;
    if(alpha >= beta) break;
  }
  return any ? best : 0;
}
function c4Bot(b, p, depth){
  let best = -Infinity, moves = [];
  for(const c of C4ORDER){
    const r = c4Drop(b, c); if(r < 0) continue;
    b[r*C4C + c] = p;
    const v = c4Line(b, r, c) ? 1000 + depth : -c4Negamax(b, depth - 1, -Infinity, Infinity, 3 - p, p);
    b[r*C4C + c] = 0;
    if(v > best){ best = v; moves = [c]; } else if(v === best) moves.push(c);
  }
  return moves[rand(moves.length)];
}
game({

game({

    let ly = c.H/2, ry = c.H/2, lt = ly, rt = ry, ball = {x:c.W/2, y:c.H/2, vx:0, vy:0}, speed = 330, sL = 0, sR = 0, serveT = 0.9, dirServe = Math.random() < .5 ? 1 : -1, running = false, over = false, err = 0;

    api.on(window, 'keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });

              const a = clamp((ball.y - ry)/(ph/2), -1, 1)*0.9; speed = Math.min(760, speed + 22);
