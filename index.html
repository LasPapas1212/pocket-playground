game({
  id:'rhythm-tap', cat:'reaction', isNew:true, title:'Rhythm Tap', icon:'🥁', color:'var(--purple)',
  blurb:'Hit the notes on the beat.', how:'Notes slide toward the ring. Tap, click, or press Space (or F / J) the moment a note is inside the ring. Perfect hits score 3, good hits 1. Every hit plays the melody. 40 notes.',
  fmt:v => v+' pts',
  mount(el, api){
    el.classList.add('flush');
    const {c, ctx} = makeCanvas(el); const P = pal(); const fx = particles();
    const HX = Math.min(120, c.W*0.22), HY = c.H/2 + 10, SPD = 300, N = 40;
    const SCALE = [262, 294, 330, 392, 440, 523, 587, 659];
    const notes = []; let t = 1.8, beat = 0.55, idx = 3;
    const gaps = [1, 1, 1, 0.5, 0.5, 1.5, 2];
    for(let i=0;i<N;i++){ idx = clamp(idx + rand(5) - 2, 0, SCALE.length - 1); notes.push({t, f:SCALE[idx], k:idx, state:0}); t += beat*gaps[rand(gaps.length)]; beat = Math.max(0.36, beat - 0.005); }
    let now = 0, running = false, over = false, pts = 0, combo = 0, best = 0, perf = 0, good = 0, miss = 0, judge = {s:'', t:0, c:P.ink}, ring = 0;
    function tap(){
      if(over) return;
      if(!running){ running = true; return; }
      let hit = null, bd = 1;
      for(const n of notes){ if(n.state) continue; const d = Math.abs(n.t - now); if(d < bd){ bd = d; hit = n; } if(n.t - now > 0.3) break; }
      ring = 0.15;
      if(hit && bd <= 0.15){
        hit.state = 1; combo++; best = Math.max(best, combo);
        if(bd <= 0.05){ pts += 3; perf++; judge = {s:'PERFECT', t:0.5, c:P.green}; } else { pts += 1; good++; judge = {s:'GOOD', t:0.5, c:P.sky}; }
        api.beep(hit.f, .22); fx.burst(HX, HY, bd <= 0.05 ? P.green : P.sky, 14);
      } else { combo = 0; judge = {s:'MISS', t:0.5, c:P.red}; api.sfx.click(); }

    api.on(window, 'keydown', e => { if((e.code === 'Space' || e.code === 'KeyJ' || e.code === 'KeyF') && !e.repeat && !(e.target.closest && e.target.closest('button,a,input'))){ e.preventDefault(); tap(); } });
    api.loop(dt => {
      if(running && !over){
        now += dt;
        for(const n of notes){ if(!n.state && now - n.t > 0.15){ n.state = 2; miss++; combo = 0; judge = {s:'MISS', t:0.5, c:P.red}; } }
        if(notes.every(n => n.state)){ over = true; api.after(() => api.end(pts, `${perf} perfect · ${good} good · ${miss} missed · best combo ${best}`), 500); }
      }
      judge.t = Math.max(0, judge.t - dt); ring = Math.max(0, ring - dt); fx.update(dt);
      ctx.clearRect(0, 0, c.W, c.H);

      ctx.strokeStyle = P.ink; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(HX, HY, 26 + ring*40, 0, Math.PI*2); ctx.stroke();
      for(const n of notes){

        ctx.strokeStyle = P.ink; ctx.lineWidth = 2.5; ctx.stroke();
      }

      txt(ctx, pts + ' pts', 16, 40, P.ink, 26, 800, 'left');
      txt(ctx, combo > 1 ? `${combo}× combo` : '', c.W - 16, 38, P.purple, 20, 800, 'right');
      txt(ctx, `${notes.filter(n => n.state).length}/${N}`, c.W - 16, 64, P.muted, 14, 600, 'right');
      if(judge.t > 0) txt(ctx, judge.s, HX, HY - 50, judge.c, 22, 800);

    });
  }
});

    el.innerHTML = '<div class="hud"><span>Moves <b class="c">0</b></span><span>Lights on <b class="o">0</b></span></div><div class="tiles lo"></div><p class="msg">Turn every light off.</p>';

    gridN(grid, n);
    const on = new Array(n*n).fill(false);
    const nb = i => { const x = i % n, y = Math.floor(i/n), out = [i]; if(y > 0) out.push(i - n); if(y < n - 1) out.push(i + n); if(x > 0) out.push(i - 1); if(x < n - 1) out.push(i + 1); return out; };
    const flip = i => nb(i).forEach(j => { on[j] = !on[j]; });
    do{ on.fill(false); shuffle([...Array(n*n).keys()]).slice(0, Math.max(3, Math.floor(n*n*0.45))).forEach(flip); } while(!on.some(Boolean));

    function press(i){
      if(done) return;
      if(!start) start = Date.now();
      flip(i); moves++; api.tone(on[i] ? 660 : 440, 0.06, {type:'sine', vol:0.07}); paint();
      if(!on.some(Boolean)){ done = true; api.after(() => api.end(moves, `${Math.round((Date.now() - start)/1000)} seconds`), 400); }
    }
    paint();
  }

/* ---------- Slide Puzzle ---------- */
game({
  id:'slide-puzzle', cat:'puzzle', isNew:true, title:'Slide Puzzle', icon:'🧩', color:'var(--blue)',
  blurb:'Slide the tiles back into order.', how:'Tap a tile next to the gap to slide it. The arrow keys slide a tile into the gap. Put the numbers in order with the gap at the bottom right. Tiles in the right spot turn teal.',
  modes:[{id:'3', label:'3×3', def:true}, {id:'4', label:'4×4'}],
  lower:true, fmt:v => v+' moves',
  mount(el, api, mode){
    const n = +mode || 3, N = n*n;
    el.innerHTML = '<div class="hud"><span>Moves <b class="c">0</b></span><span>Time <b class="t">0</b></span></div><div class="tiles sp"></div>';
    const grid = $('.sp', el), cEl = $('.c', el), tEl = $('.t', el);
    gridN(grid, n);
    const t = [...Array(N).keys()].map(i => (i + 1) % N);
    let blank = N - 1, prev = -1;
    const adj = i => { const x = i % n, y = Math.floor(i/n), o = []; if(y > 0) o.push(i - n); if(y < n - 1) o.push(i + n); if(x > 0) o.push(i - 1); if(x < n - 1) o.push(i + 1); return o; };
    const solved = () => t.every((v, i) => v === (i + 1) % N);
    const shuffleMoves = () => { for(let k=0;k<N*25;k++){ const opts = adj(blank).filter(j => j !== prev); const j = opts[rand(opts.length)]; [t[blank], t[j]] = [t[j], t[blank]]; prev = blank; blank = j; } };
    do{ shuffleMoves(); } while(solved());
    let moves = 0, start = 0, done = false;
    const cells = Array.from({length:N}, (_, i) => { const b = document.createElement('button'); b.type = 'button'; api.on(b, 'click', () => slide(i)); grid.appendChild(b); return b; });
    function paint(){ cells.forEach((b, i) => { const v = t[i]; b.textContent = v || ''; b.className = v ? (v === i + 1 ? 'ok' : '') : 'gap'; b.setAttribute('aria-label', v ? 'Tile ' + v : 'Gap'); }); cEl.textContent = moves; }
    function slide(i){
      if(done || !adj(blank).includes(i)) return;
      if(!start){ start = Date.now(); api.every(() => { if(!done) tEl.textContent = Math.floor((Date.now() - start)/1000); }, 250); }
      [t[blank], t[i]] = [t[i], t[blank]]; blank = i; moves++;
      api.tone(520 + rand(5)*30, 0.04, {type:'triangle', vol:0.06}); paint();
      if(solved()){ done = true; api.after(() => api.end(moves, `${Math.floor((Date.now() - start)/1000)} seconds`), 300); }
    }
    api.on(window, 'keydown', e => {
      if(e.ctrlKey || e.metaKey || e.altKey) return;
      const x = blank % n, y = Math.floor(blank/n);
      if(e.key === 'ArrowUp' && y < n - 1){ e.preventDefault(); slide(blank + n); }
      if(e.key === 'ArrowDown' && y > 0){ e.preventDefault(); slide(blank - n); }
      if(e.key === 'ArrowLeft' && x < n - 1){ e.preventDefault(); slide(blank + 1); }
      if(e.key === 'ArrowRight' && x > 0){ e.preventDefault(); slide(blank - 1); }
    });
    paint();
  }
});

/* ---------- Math Sprint ---------- */
game({
  id:'math-sprint', cat:'puzzle', isNew:true, typing:true, title:'Math Sprint', icon:'➗', color:'var(--teal)',
  blurb:'Solve as many sums as you can in 60s.', how:'Type the answer. It moves on as soon as it’s right. Problems get harder as you go. Press Enter to skip one.',
  fmt:v => v+' solved',
  mount(el, api){
    el.innerHTML = '<div class="hud"><span>Time <b class="t">60</b></span><span>Solved <b class="c">0</b></span></div><div class="problem" aria-live="polite"></div><input class="typein" id="math-ans" inputmode="numeric" autocomplete="off" aria-label="Your answer" placeholder="Answer" style="max-width:240px;text-align:center"><p class="msg">Press Enter to skip.</p>';
    const prob = $('.problem', el), inp = $('#math-ans', el), tEl = $('.t', el), cEl = $('.c', el), msg = $('.msg', el);
    let ans = 0, solved = 0, start = 0, over = false;
    function gen(){
      const lvl = solved, r = Math.random(); let a, b, op;
      if(lvl < 4 || r < 0.35){ op = '+'; a = 2 + rand(10 + lvl*4); b = 2 + rand(10 + lvl*4); ans = a + b; }
      else if(r < 0.6){ op = '−'; a = 5 + rand(15 + lvl*4); b = 1 + rand(a); ans = a - b; }
      else if(r < 0.85){ op = '×'; a = 2 + rand(Math.min(11, 3 + Math.floor(lvl/2))); b = 2 + rand(Math.min(11, 3 + Math.floor(lvl/3))); ans = a*b; }
      else { op = '÷'; b = 2 + rand(Math.min(10, 2 + Math.floor(lvl/3))); ans = 1 + rand(Math.min(12, 3 + Math.floor(lvl/2))); a = b*ans; }
      prob.textContent = `${a} ${op} ${b}`; prob.classList.remove('pop'); void prob.offsetWidth; prob.classList.add('pop');
    }
    function tick(){
      if(over) return;
      const left = 60 - (Date.now() - start)/1000; tEl.textContent = Math.max(0, Math.ceil(left));
      if(left <= 0){ over = true; inp.disabled = true; api.end(solved); }
    }
    api.on(inp, 'input', () => {
      if(over) return;
      if(!start){ start = Date.now(); api.every(tick, 100); }
      const v = inp.value.trim();
      if(/^\d+$/.test(v) && +v === ans){ solved++; cEl.textContent = solved; api.sfx.coin(); api.floatOn(prob, '+1'); inp.value = ''; msg.textContent = 'Press Enter to skip.'; gen(); }
    });
    api.on(inp, 'keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); if(over) return; if(!start){ start = Date.now(); api.every(tick, 100); } msg.textContent = `Skipped: ${prob.textContent} = ${ans}`; inp.value = ''; api.sfx.click(); gen(); } });
    gen(); inp.focus({preventScroll:true});
  }
});

/* ---------- Maze Run ---------- */
game({
  id:'maze-run', cat:'puzzle', isNew:true, title:'Maze Run', icon:'🌀', color:'var(--purple)',
  blurb:'Find your way out as fast as you can.', how:'Use the arrow keys, WASD, or swipe to move. Reach the flag in the bottom-right corner. The timer starts on your first move. Every maze is new.',
  modes:[{id:'easy', label:'Easy'}, {id:'medium', label:'Medium', def:true}, {id:'hard', label:'Hard'}],
  lower:true, fmt:v => v.toFixed(1)+' s',
  mount(el, api, mode){
    el.classList.add('flush');
    const {c, ctx} = makeCanvas(el); const P = pal();
    const cfg = {easy:[10, 7], medium:[16, 11], hard:[24, 16]}[mode] || [16, 11];
    let cols = cfg[0], rows = cfg[1];
    const fit = () => Math.floor(Math.min((c.W - 24)/cols, (c.H - 70)/rows));
    if(fit() < 14){ const k = 14/fit(); cols = Math.max(6, Math.floor(cols/k)); rows = Math.max(5, Math.floor(rows/k)); }
    const S = fit(), ox = Math.floor((c.W - cols*S)/2), oy = 54 + Math.floor((c.H - 60 - rows*S)/2);
    const W = Array.from({length:cols*rows}, () => [true, true, true, true]);
    const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
    const seen = new Uint8Array(cols*rows), stack = [0]; seen[0] = 1;
    while(stack.length){
      const cur = stack[stack.length - 1], x = cur % cols, y = Math.floor(cur/cols), opts = [];
      for(let d=0;d<4;d++){ const nx = x + DX[d], ny = y + DY[d]; if(nx >= 0 && ny >= 0 && nx < cols && ny < rows && !seen[ny*cols + nx]) opts.push(d); }
      if(!opts.length){ stack.pop(); continue; }
      const d = opts[rand(opts.length)], nI = (y + DY[d])*cols + x + DX[d];
      W[cur][d] = false; W[nI][(d + 2) % 4] = false; seen[nI] = 1; stack.push(nI);
    }
    let px = 0, py = 0, dx = 0, dy = 0, start = 0, done = false, bumpT = 0;
    const trail = new Set([0]);
    function move(d){
      if(done || d === undefined) return;
      const i = py*cols + px;
      if(W[i][d]){ bumpT = 0.15; return; }
      if(!start) start = performance.now();
      px += DX[d]; py += DY[d]; trail.add(py*cols + px);
      api.tone(480 + (trail.size % 8)*30, 0.03, {type:'triangle', vol:0.035});
      if(px === cols - 1 && py === rows - 1){ done = true; const t = (performance.now() - start)/1000; api.end(Math.round(t*10)/10, `${trail.size} squares visited`); }
    }
    const KEY = {ArrowUp:0, KeyW:0, ArrowRight:1, KeyD:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3};
    api.on(window, 'keydown', e => { const d = KEY[e.code]; if(d !== undefined && !e.ctrlKey && !e.metaKey && !e.altKey && !(e.target.closest && e.target.closest('input'))){ e.preventDefault(); move(d); } });
    onSwipe(api, c, s => move({U:0, R:1, D:2, L:3}[s]));
    api.loop(dt => {
      dx += (px - dx)*Math.min(1, dt*20); dy += (py - dy)*Math.min(1, dt*20); bumpT = Math.max(0, bumpT - dt);
      ctx.clearRect(0, 0, c.W, c.H);
      ctx.fillStyle = 'rgba(123,92,214,.18)'; trail.forEach(i => ctx.fillRect(ox + (i % cols)*S, oy + Math.floor(i/cols)*S, S, S));
      ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.lineCap = 'square'; ctx.beginPath();
      for(let i=0;i<W.length;i++){
        const x = ox + (i % cols)*S, y = oy + Math.floor(i/cols)*S;
        if(W[i][0]){ ctx.moveTo(x, y); ctx.lineTo(x + S, y); }
        if(W[i][3]){ ctx.moveTo(x, y); ctx.lineTo(x, y + S); }
        if(i % cols === cols - 1 && W[i][1]){ ctx.moveTo(x + S, y); ctx.lineTo(x + S, y + S); }
        if(Math.floor(i/cols) === rows - 1 && W[i][2]){ ctx.moveTo(x, y + S); ctx.lineTo(x + S, y + S); }
      }
      ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `${S*0.75}px ${EMOJI}`;
      ctx.fillText('🏁', ox + (cols - 0.5)*S, oy + (rows - 0.5)*S);
      ctx.fillStyle = bumpT > 0 ? P.red : P.purple; ctx.beginPath(); ctx.arc(ox + (dx + 0.5)*S, oy + (dy + 0.5)*S, S*0.32, 0, Math.PI*2); ctx.fill();
      const t = start ? ((done ? 0 : performance.now()) - start)/1000 : 0;
      txt(ctx, start && !done ? t.toFixed(1) + 's' : (done ? 'Done!' : '0.0s'), 16, 38, P.ink, 24, 800, 'left');
      txt(ctx, `${cols} × ${rows}`, c.W - 16, 36, P.muted, 14, 600, 'right');
    });
  }
});

/* ---------- Grid Recall ---------- */
game({
  id:'grid-recall', cat:'memory', isNew:true, title:'Grid Recall', icon:'🔲', color:'var(--blue)',
  blurb:'Remember which squares lit up.', how:'Some squares flash blue. When they go dark, tap all the squares that lit up. Each level adds one more square, and the grid grows. 3 misses on a level costs a heart. You have 3 hearts.',
  fmt:v => 'level '+v,
  mount(el, api){
    el.innerHTML = '<div class="hud"><span>Level <b class="c">1</b></span><span>Hearts <b class="h">♥♥♥</b></span></div><div class="tiles vm"></div><p class="msg" aria-live="polite">Watch the squares…</p>';
    const grid = $('.vm', el), cEl = $('.c', el), hEl = $('.h', el), msg = $('.msg', el);
    let level = 1, hearts = 3, targets = new Set(), found = new Set(), wrong = 0, phase = 'show', over = false, cells = [];
    function setup(){
      const n = level < 3 ? 3 : level < 6 ? 4 : level < 10 ? 5 : 6, k = Math.min(n*n - 1, level + 2);
      grid.innerHTML = ''; gridN(grid, n);
      cells = Array.from({length:n*n}, (_, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Square ' + (i+1)); b.addEventListener('click', () => pick(i)); grid.appendChild(b); return b; });
      targets = new Set(shuffle([...Array(n*n).keys()]).slice(0, k)); found = new Set(); wrong = 0; phase = 'show';
      msg.textContent = 'Watch the squares…';
      api.after(() => { targets.forEach(i => cells[i].classList.add('lit')); api.tone(660, 0.12, {type:'sine', vol:0.06}); }, 450);
      api.after(() => { cells.forEach(b => b.classList.remove('lit')); phase = 'input'; msg.textContent = `Tap the ${k} squares that lit up.`; }, 450 + 900 + level*60);
    }
    function pick(i){
      if(phase !== 'input' || over) return;
      const b = cells[i];
      if(found.has(i) || b.classList.contains('bad')) return;
      if(targets.has(i)){
        found.add(i); b.classList.add('got'); api.tone(500 + found.size*60, 0.06, {type:'triangle', vol:0.06});
        if(found.size === targets.size){ phase = 'wait'; api.sfx.level(); msg.textContent = 'Nice!'; level++; api.after(() => { cEl.textContent = level; setup(); }, 700); }
      } else {
        b.classList.add('bad'); wrong++; api.sfx.miss();
        if(wrong >= 3){
          hearts--; hEl.textContent = '♥'.repeat(Math.max(0, hearts)) + '♡'.repeat(3 - Math.max(0, hearts)); phase = 'wait';
          targets.forEach(j => { if(!found.has(j)) cells[j].classList.add('lit'); });
          if(hearts <= 0){ over = true; api.after(() => api.end(level - 1, `Reached level ${level}`), 900); }
          else { msg.textContent = '3 misses. You lost a heart. Try this level again.'; api.after(setup, 1400); }
        }
      }
    }
    setup();
  }
});

/* ---------- Word Scramble ---------- */
const SCRAMBLE = [...new Set(ANSWERS.concat('planet rocket castle dragon pirate jungle winter summer guitar silver orange purple yellow button candle forest island bridge friend school laptop window rabbit monkey turtle spider cookie butter cheese banana cherry'.split(' ')))].filter(w => /^[a-z]{5,7}$/.test(w));
const SCRAMBLE_SET = new Set(SCRAMBLE);
game({
  id:'word-scramble', cat:'word', isNew:true, typing:true, title:'Word Scramble', icon:'🔀', color:'var(--pink)',
  blurb:'Unscramble as many words as you can.', how:'Rearrange the letters to find the word and type it. It moves on as soon as you get it. Press Enter to skip. 60 seconds.',
  fmt:v => v+' words',
  mount(el, api){
    el.innerHTML = '<div class="hud"><span>Time <b class="t">60</b></span><span>Words <b class="c">0</b></span></div><div class="ws-tiles" aria-live="polite"></div><input class="typein" id="ws-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer" placeholder="Type the word…" style="max-width:320px;text-align:center"><p class="msg">Press Enter to skip.</p>';
    const tiles = $('.ws-tiles', el), inp = $('#ws-in', el), tEl = $('.t', el), cEl = $('.c', el), msg = $('.msg', el);
    let word = '', solved = 0, start = 0, over = false; const used = new Set();
    const sorted = s => [...s].sort().join('');
    function next(){
      let w; do{ w = SCRAMBLE[rand(SCRAMBLE.length)]; }while(used.has(w) && used.size < SCRAMBLE.length - 1);
      used.add(w); word = w;
      let s = w, tries = 0; while(s === w && tries < 20){ s = shuffle([...w]).join(''); tries++; }
      tiles.innerHTML = [...s].map((ch, i) => `<span style="animation-delay:${i*35}ms">${ch}</span>`).join('');
    }
    function tick(){
      if(over) return;
      const left = 60 - (Date.now() - start)/1000; tEl.textContent = Math.max(0, Math.ceil(left));
      if(left <= 0){ over = true; inp.disabled = true; api.end(solved, `The last word was ${word.toUpperCase()}`); }

    api.on(inp, 'input', () => {
      if(over) return; begin();
      const v = inp.value.trim().toLowerCase();

const GUESS_WORDS = {
  Animals:['elephant','giraffe','penguin','dolphin','kangaroo','octopus','squirrel','hedgehog','flamingo','cheetah'],
  Food:['pancake','spaghetti','avocado','pretzel','sandwich','blueberry','popcorn','burrito','pineapple','cupcake'],
  Places:['volcano','library','airport','desert','museum','lighthouse','island','stadium','bakery','canyon'],

game({
  id:'balloon-words', cat:'word', isNew:true, typing:true, title:'Balloon Words', icon:'🔠', color:'var(--sky)',

    const cEl = $('.c', el), catEl = $('.bw-cat', el), balloons = $('.bw-balloons', el), wordEl = $('.bw-word', el), kb = $('.fl-kb', el);
    let word = '', guessed = new Set(), wrong = 0, streak = 0, over = false, busy = false;
    const keyEls = {};

      const row = document.createElement('div');
      for(const ch of line){ const b = document.createElement('button'); b.type = 'button'; b.tabIndex = -1; b.textContent = ch; keyEls[ch] = b; api.on(b, 'mousedown', e => e.preventDefault()); api.on(b, 'click', () => guess(ch)); row.appendChild(b); }
      kb.appendChild(row);

    const light = $('.duel-light', el), msg = $('.duel-msg', el);
    let s1 = 0, s2 = 0, state = 'idle', goAt = 0, tid = null, botT = null, over = false; const WIN = 5;
    function round(){
      state = 'wait'; light.className = 'duel-light wait'; msg.textContent = 'Wait for green…';
      tid = api.after(go, 1200 + Math.random()*2300);
      if(bot && mode === 'easy' && Math.random() < 0.1) botT = api.after(() => press(2), 500 + Math.random()*900);
    }
    function go(){
      state = 'go'; goAt = performance.now(); light.className = 'duel-light go'; msg.textContent = 'GO!';
      api.tone(880, 0.12, {type:'square', vol:0.05});
      if(bot){ api.cancel(botT); botT = api.after(() => press(2), RT[0] + Math.random()*(RT[1] - RT[0])); }
    }
    function press(p){
      if(over) return;
      if(state === 'idle'){ round(); return; }
      if(state === 'wait'){ api.cancel(tid); api.cancel(botT); point(3 - p, `${p === 1 ? n1 : n2} jumped the gun!`); return; }
      if(state === 'go'){ api.cancel(botT); point(p, `${p === 1 ? n1 : n2} wins in ${Math.round(performance.now() - goAt)} ms`); }
    }
    function point(p, text){
      state = 'between';
      if(p === 1) s1++; else s2++;
      $('.s1', el).textContent = s1; $('.s2', el).textContent = s2;
      light.className = 'duel-light ' + (p === 1 ? 'w1' : 'w2'); msg.textContent = text;
      if(bot && p === 2) api.sfx.miss(); else api.sfx.coin();
      const side = $(p === 1 ? '.p1' : '.p2', el); side.classList.remove('flash'); void side.offsetWidth; side.classList.add('flash');
      if(s1 >= WIN || s2 >= WIN){
        over = true;
        api.after(() => api.result(s1 > s2 ? (bot ? 'You win! 🎉' : `${n1} wins! 🎉`) : (bot ? 'The bot wins' : `${n2} wins! 🎉`), `${n1} ${s1} – ${s2} ${n2}`), 900);
      } else api.after(round, 1500);
    }
    api.on($('.p1', el), 'pointerdown', () => press(1));
    api.on($('.p2', el), 'pointerdown', () => press(bot ? 1 : 2));
    api.on($('.duel-mid', el), 'pointerdown', () => { if(state === 'idle') press(1); });
    api.on(window, 'keydown', e => {
      if(e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
      if(e.code === 'KeyA' || (bot && e.code === 'Space')){ e.preventDefault(); press(1); }
      else if(e.code === 'KeyL' && !bot){ e.preventDefault(); press(2); }
      else if(e.code === 'Space' && state === 'idle'){ e.preventDefault(); press(1); }
    });
  }
});

  mount(el, api){

    el.innerHTML = '<div class="hud"><span>This sheet <b class="c">0</b></span><span>All-time <b class="a">0</b></span><button class="btn sm fresh" type="button">New sheet</button></div><div class="bubbles"></div>';
    const grid = $('.bubbles', el), cEl = $('.c', el), aEl = $('.a', el);

    aEl.textContent = total;
    function sheet(){
      grid.innerHTML = ''; grid.classList.remove('roll'); void grid.offsetWidth; grid.classList.add('roll');
      popped = 0; cEl.textContent = 0;

/* ---------- Paint Splat ---------- */
game({
  id:'paint-splat', cat:'chill', toy:true, isNew:true, title:'Paint Splat', icon:'🖌️', color:'var(--pink)',
  blurb:'Splat paint everywhere. Make art.', how:'Click or tap to splat paint. Drag to paint a trail of drops. Use the buttons to switch palettes or start over.',
  mount(el, api){
    el.classList.add('flush');
    const {c, ctx} = makeCanvas(el); const P = pal();
    el.insertAdjacentHTML('beforeend', '<div class="paint-tools"><button class="btn sm pal" type="button">🎨 Rainbow</button><button class="btn sm clr" type="button">🧽 Clear</button></div><p class="float-msg">Click or drag to splat paint</p>');
    const msg = $('.float-msg', el), palB = $('.pal', el);
    const PALS = {
      Rainbow: () => `hsl(${rand(360)} 85% 58%)`,
      Pastel: () => `hsl(${rand(360)} 70% 80%)`,
      Neon: () => ['#ff2bd6', '#00f0ff', '#b6ff00', '#ffea00', '#ff5e00'][rand(5)],
      Ocean: () => `hsl(${180 + rand(60)} ${60 + rand(30)}% ${40 + rand(30)}%)`
    };
    const names = Object.keys(PALS);
    let pi = 0, down = false, last = null;
    const clear = () => { ctx.fillStyle = P.surface; ctx.fillRect(0, 0, c.W, c.H); };
    function blob(x, y, r, col){
      ctx.fillStyle = col; ctx.beginPath();
      for(let i=0;i<=10;i++){ const a = i/10*Math.PI*2, rr = r*(0.75 + Math.random()*0.4); const qx = x + Math.cos(a)*rr, qy = y + Math.sin(a)*rr; if(i) ctx.lineTo(qx, qy); else ctx.moveTo(qx, qy); }
      ctx.closePath(); ctx.fill();
    }
    function splat(x, y, big){
      const col = PALS[names[pi]](), r = big ? 18 + Math.random()*26 : 6 + Math.random()*8;
      blob(x, y, r, col);
      const drops = big ? 8 + rand(8) : 2;
      for(let i=0;i<drops;i++){ const a = Math.random()*Math.PI*2, d = r*(1 + Math.random()*1.6); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + Math.cos(a)*d, y + Math.sin(a)*d, Math.random()*r*0.25 + 1.5, 0, Math.PI*2); ctx.fill(); }
      if(big) api.tone(150 + Math.random()*120, 0.12, {type:'sine', slide:-60, vol:0.14});
    }
    clear();
    api.on(c, 'pointerdown', e => { down = true; const p = ptr(c, e); last = p; splat(p.x, p.y, true); msg.hidden = true; });
    api.on(c, 'pointermove', e => { if(!down) return; const p = ptr(c, e); if(Math.hypot(p.x - last.x, p.y - last.y) > 14){ splat(p.x, p.y, false); last = p; } });
    api.on(window, 'pointerup', () => { down = false; });
    api.on(palB, 'click', () => { pi = (pi + 1) % names.length; palB.textContent = '🎨 ' + names[pi]; });
    api.on($('.clr', el), 'click', () => { clear(); api.sfx.click(); msg.hidden = false; });
  }
});

function showGame(g){

  $$('.gamehead .seg button').forEach(b => b.addEventListener('click', () => { prefs.modes[g.id] = b.dataset.mode; savePrefs(); mountGame(g); }));
  $('#restart').addEventListener('click', () => mountGame(g));

function refreshBest(g){
  const p = $('#bestpill'); if(!p) return;
  p.hidden = !!(g.twoP || g.toy);
  const t = bestText(g); p.textContent = t || 'No best score yet'; p.classList.toggle('has', !!t);
}
function stopGame(){ if(current){ current.bag.run(); current = null; } }

function overlay(stage, g, o){
  const ov = document.createElement('div'); ov.className = 'end';
  ov.innerHTML = `<div class="endbox" role="dialog" aria-label="Results"><p class="eyebrow ${o.isNew ? 'new' : ''}">${o.eyebrow}</p><p class="big">${o.big}</p>${o.detail ? `<p class="detail">${o.detail}</p>` : ''}<p class="muted">${o.sub}</p>
    <div class="endbtns"><button class="btn primary again" type="button">↻ Play again</button><a class="btn" href="#games">All games</a></div></div>`;
  stage.appendChild(ov);
  const shown = performance.now(), again = $('.again', ov);
  /* ignore clicks/keys for a moment so a key still held from the game doesn't skip the results */
  again.addEventListener('click', () => { if(performance.now() - shown < 600) return; mountGame(g); });
  setTimeout(() => { if(again.isConnected) again.focus({preventScroll:true}); }, 60);
}

function mountGame(g){
  stopGame();
  const mode = modeOf(g);
  $$('.gamehead .seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  refreshBest(g);
  const old = $('#stage'); if(!old) return;
  const stage = document.createElement('div'); stage.id = 'stage'; stage.className = 'stage'; stage.tabIndex = -1;
  old.replaceWith(stage);
  const b = bag(); let ended = false;
  current = {g, bag:b};
  const key = bestKey(g, mode);
  const reportKey = (k, score) => {
    const prev = store.get(k);
    if(!g.lower && score <= 0) return {isNew:false, best:prev}; /* a zero is never a "best" */
    const isNew = prev == null || (g.lower ? score < prev : score > prev);
    if(isNew) store.set(k, score);
    return {isNew, best: isNew ? score : prev};
  };
  const api = {
    mode,
    on: (t, type, fn, o) => b.on(t, type, fn, o),
    after: (fn, ms) => b.after(fn, ms),
    every: (fn, ms) => b.every(fn, ms),
    cancel: id => { clearTimeout(id); clearInterval(id); },
    loop: fn => b.loop(fn),
    beep, tone, sfx:SFX,
    float: (x, y, t, col) => floatText(stage, x, y, t, col),
    floatOn: (node, t, col) => { const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect(); floatText(stage, r.left - s.left + r.width/2, r.top - s.top + r.height/3, t, col); },
    shake: () => shake(stage),
    report(score){ const r = reportKey(key, score); bumpPlays(g); refreshBest(g); return r; },
    reportExtra(name, score){ const r = reportKey(key + ':' + name, score); refreshBest(g); return r; },
    end(score, detail=''){
      if(ended) return; ended = true;
      const r = api.report(score);
      if(r.isNew){ SFX.win(); confetti(stage); } else SFX.end();
      overlay(stage, g, {eyebrow: r.isNew ? '🎉 New personal best!' : 'Game over', isNew:r.isNew, big:g.fmt(score), sub: r.best != null ? 'Your best: ' + g.fmt(r.best) : 'No best score yet', detail});
    },
    fail(big, detail=''){
      if(ended) return; ended = true; bumpPlays(g); SFX.lose(); shake(stage);
      const best = store.get(key);
      overlay(stage, g, {eyebrow:'Game over', big, sub: best != null ? 'Your best: ' + g.fmt(best) : 'No best score yet', detail});
    },
    result(big, detail=''){
      if(ended) return; ended = true; bumpPlays(g); SFX.win(); confetti(stage);
      overlay(stage, g, {eyebrow:'Match over', big, sub:'', detail});
    }
  };
  try{ g.mount(stage, api, mode); }
  catch(err){
    console.error(err); b.run();
    stage.innerHTML = '<p class="msg">This game hit a problem while loading.</p><button class="btn primary" type="button">Try again</button>';
    $('button', stage).addEventListener('click', () => mountGame(g));
  }
  if(!stage.contains(document.activeElement)) stage.focus({preventScroll:true});
}

    const st = $('#stage'), cv = st && st.querySelector('canvas.cv');
    if(!current || !cv) return;
    if(Math.abs(st.clientWidth - cv.W) > 2 || Math.abs(st.clientHeight - cv.H) > 2) mountGame(current.g);
  }, 300);
});

function route(){
  const g = byId(location.hash.replace(/^#\/?/, ''));
  g ? showGame(g) : showHome();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
